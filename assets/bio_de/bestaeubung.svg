<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Bestäubung und Befruchtung</title>
  <desc id="desc">Deutsch beschrifteter Ablauf von Pollen zur Samenbildung.</desc>
  <rect width="960" height="540" fill="#f6fbf3"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#17351f}.h{font-size:34px;font-weight:800}.l{font-size:22px;font-weight:700}.s{font-size:18px}.card{fill:#fff;stroke:#8fbd6b;stroke-width:3}.arrow{stroke:#2f7d4a;stroke-width:6;marker-end:url(#a);fill:none}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2f7d4a"/></marker></defs>
  <text x="480" y="55" text-anchor="middle" class="h">Bestäubung: vom Pollen zum Samen</text>
  <g transform="translate(58 130)">
    <rect class="card" width="240" height="260" rx="20"/>
    <circle cx="124" cy="88" r="46" fill="#f59e0b"/><g fill="#f472b6"><ellipse cx="75" cy="92" rx="42" ry="24"/><ellipse cx="173" cy="92" rx="42" ry="24"/><ellipse cx="124" cy="38" rx="24" ry="42"/><ellipse cx="124" cy="140" rx="24" ry="42"/></g>
    <text x="120" y="206" text-anchor="middle" class="l">1 Pollen</text><text x="120" y="236" text-anchor="middle" class="s">entsteht im Staubblatt</text>
  </g>
  <path d="M320 260 H410" class="arrow"/>
  <g transform="translate(430 130)">
    <rect class="card" width="240" height="260" rx="20"/>
    <path d="M56 112 C96 70 142 70 184 112" fill="none" stroke="#7c3aed" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="83" cy="106" rx="23" ry="13" fill="#f6c453"/><ellipse cx="124" cy="82" rx="23" ry="13" fill="#f6c453"/><ellipse cx="164" cy="108" rx="23" ry="13" fill="#f6c453"/>
    <path d="M122 118 C116 160 116 178 122 218" stroke="#2f7d4a" stroke-width="12" fill="none" stroke-linecap="round"/>
    <text x="120" y="206" text-anchor="middle" class="l">2 Bestäubung</text><text x="120" y="236" text-anchor="middle" class="s">Pollen erreicht die Narbe</text>
  </g>
  <path d="M690 260 H780" class="arrow"/>
  <g transform="translate(800 130)">
    <rect class="card" width="120" height="260" rx="20"/>
    <path d="M60 42 C84 94 84 154 60 218 C36 154 36 94 60 42Z" fill="#86c06a"/>
    <circle cx="60" cy="150" r="28" fill="#facc15"/>
    <text x="60" y="238" text-anchor="middle" class="l">Samen</text>
  </g>
  <text x="480" y="468" text-anchor="middle" class="l">Befruchtung: Erbinformationen verbinden sich in der Samenanlage.</text>
</svg>
