<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Einhäusig und zweihäusig</title>
  <desc id="desc">Deutsch beschrifteter Vergleich der Blütenverteilung.</desc>
  <rect width="960" height="540" fill="#f7fbf5"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#17351f}.h{font-size:34px;font-weight:800}.l{font-size:24px;font-weight:800}.s{font-size:19px}.card{fill:#fff;stroke:#93b66f;stroke-width:3}.stem{stroke:#53823d;stroke-width:12;stroke-linecap:round}.flowerF{fill:#f472b6}.flowerM{fill:#60a5fa}
  </style>
  <text x="480" y="55" text-anchor="middle" class="h">Einhäusig und zweihäusig</text>
  <g transform="translate(80 112)">
    <rect class="card" width="360" height="340" rx="22"/>
    <text x="180" y="44" text-anchor="middle" class="l">einhäusig</text>
    <path class="stem" d="M180 292 V116"/><ellipse cx="116" cy="188" rx="68" ry="30" fill="#6abf69" transform="rotate(-26 116 188)"/><ellipse cx="244" cy="226" rx="68" ry="30" fill="#6abf69" transform="rotate(24 244 226)"/>
    <g transform="translate(138 112)"><circle r="28" class="flowerM"/><text x="0" y="7" text-anchor="middle" class="l">♂</text></g>
    <g transform="translate(222 146)"><circle r="28" class="flowerF"/><text x="0" y="8" text-anchor="middle" class="l">♀</text></g>
    <text x="180" y="318" text-anchor="middle" class="s">männliche und weibliche</text><text x="180" y="342" text-anchor="middle" class="s">Blüten an einer Pflanze</text>
  </g>
  <g transform="translate(520 112)">
    <rect class="card" width="360" height="340" rx="22"/>
    <text x="180" y="44" text-anchor="middle" class="l">zweihäusig</text>
    <path class="stem" d="M120 292 V132 M246 292 V132"/><ellipse cx="82" cy="208" rx="54" ry="24" fill="#6abf69" transform="rotate(-26 82 208)"/><ellipse cx="285" cy="214" rx="54" ry="24" fill="#6abf69" transform="rotate(24 285 214)"/>
    <g transform="translate(120 114)"><circle r="30" class="flowerM"/><text x="0" y="8" text-anchor="middle" class="l">♂</text></g>
    <g transform="translate(246 114)"><circle r="30" class="flowerF"/><text x="0" y="8" text-anchor="middle" class="l">♀</text></g>
    <text x="180" y="318" text-anchor="middle" class="s">männliche und weibliche</text><text x="180" y="342" text-anchor="middle" class="s">Blüten auf getrennten Pflanzen</text>
  </g>
</svg>
