<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Ernährungsteller</title>
  <desc id="desc">Deutsch beschriftetes Teller-Modell für eine ausgewogene Mahlzeit.</desc>
  <rect width="960" height="540" fill="#f8fbf7"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#20301d}.h{font-size:34px;font-weight:800}.l{font-size:22px;font-weight:700}.s{font-size:18px}.plate{fill:#fff;stroke:#bdc9b7;stroke-width:8}.note{fill:#fff;stroke:#8ab47b;stroke-width:3}
  </style>
  <text x="480" y="55" text-anchor="middle" class="h">Ausgewogen essen: der Teller als Modell</text>
  <g transform="translate(392 292)">
    <circle r="174" class="plate"/>
    <path d="M0 0 L0 -162 A162 162 0 0 1 140 81 Z" fill="#70c174"/>
    <path d="M0 0 L140 81 A162 162 0 0 1 -30 159 Z" fill="#f4c430"/>
    <path d="M0 0 L-30 159 A162 162 0 0 1 -162 0 Z" fill="#ec6b6b"/>
    <path d="M0 0 L-162 0 A162 162 0 0 1 0 -162 Z" fill="#6fa8dc"/>
    <circle r="46" fill="#fff" stroke="#bdc9b7" stroke-width="5"/>
  </g>
  <g font-weight="700">
    <text x="392" y="196" text-anchor="middle" class="l">Gemüse</text>
    <text x="492" y="348" text-anchor="middle" class="l">Getreide</text>
    <text x="291" y="374" text-anchor="middle" class="l">Eiweiß</text>
    <text x="292" y="244" text-anchor="middle" class="l">Obst</text>
  </g>
  <g transform="translate(640 170)">
    <rect class="note" width="230" height="70" rx="18"/><text x="115" y="30" text-anchor="middle" class="l">Wasser</text><text x="115" y="55" text-anchor="middle" class="s">statt süßer Getränke</text>
    <rect class="note" y="96" width="230" height="94" rx="18"/><text x="115" y="130" text-anchor="middle" class="l">Abwechslung</text><text x="115" y="158" text-anchor="middle" class="s">macht Versorgung</text><text x="115" y="181" text-anchor="middle" class="s">wahrscheinlicher</text>
  </g>
</svg>
