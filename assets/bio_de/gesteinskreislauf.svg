<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Gesteinskreislauf</title>
  <desc id="desc">Deutsch beschrifteter Kreislauf der Gesteine.</desc>
  <rect width="960" height="540" fill="#faf8f4"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#2d2418}.h{font-size:34px;font-weight:800}.l{font-size:22px;font-weight:700}.s{font-size:17px}.box{fill:#fff;stroke:#b59672;stroke-width:3}.arrow{stroke:#8b5e34;stroke-width:6;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8b5e34"/></marker></defs>
  <text x="480" y="56" text-anchor="middle" class="h">Der Gesteinskreislauf</text>
  <g transform="translate(110 138)"><rect class="box" width="220" height="88" rx="18"/><text x="110" y="38" text-anchor="middle" class="l">Magma</text><text x="110" y="66" text-anchor="middle" class="s">geschmolzenes Gestein</text></g>
  <g transform="translate(626 138)"><rect class="box" width="220" height="88" rx="18"/><text x="110" y="38" text-anchor="middle" class="l">Erstarrungsgestein</text><text x="110" y="66" text-anchor="middle" class="s">durch Abkühlung</text></g>
  <g transform="translate(626 334)"><rect class="box" width="220" height="88" rx="18"/><text x="110" y="38" text-anchor="middle" class="l">Sedimentgestein</text><text x="110" y="66" text-anchor="middle" class="s">aus Ablagerungen</text></g>
  <g transform="translate(110 334)"><rect class="box" width="220" height="88" rx="18"/><text x="110" y="38" text-anchor="middle" class="l">Umwandlungsgestein</text><text x="110" y="66" text-anchor="middle" class="s">durch Druck und Hitze</text></g>
  <path d="M330 182 H604" class="arrow"/><text x="467" y="162" text-anchor="middle" class="s">Abkühlen</text>
  <path d="M736 226 V316" class="arrow"/><text x="804" y="278" text-anchor="middle" class="s">Verwitterung</text>
  <path d="M626 378 H352" class="arrow"/><text x="489" y="358" text-anchor="middle" class="s">Druck und Hitze</text>
  <path d="M220 334 V246" class="arrow"/><text x="146" y="292" text-anchor="middle" class="s">Aufschmelzen</text>
  <circle cx="480" cy="280" r="56" fill="#f5d0a9" stroke="#8b5e34" stroke-width="5"/><text x="480" y="286" text-anchor="middle" class="l">Kreislauf</text>
</svg>
