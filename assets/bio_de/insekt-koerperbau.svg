<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Körperbau eines Insekts</title>
  <desc id="desc">Deutsch beschriftetes Insekt mit Kopf, Brust, Hinterleib und sechs Beinen.</desc>
  <rect width="960" height="540" fill="#fbfaf5"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#2d2418}.h{font-size:34px;font-weight:800}.l{font-size:22px;font-weight:700}.label{fill:#fff;stroke:#b5965d;stroke-width:3}.line{stroke:#725b31;stroke-width:4;fill:none}.leg{stroke:#4a3f2f;stroke-width:8;stroke-linecap:round}
  </style>
  <text x="480" y="55" text-anchor="middle" class="h">Körperbau eines Insekts</text>
  <g transform="translate(480 270)">
    <ellipse cx="-118" cy="0" rx="60" ry="52" fill="#d69e2e" stroke="#6b4e16" stroke-width="6"/>
    <ellipse cx="-22" cy="0" rx="72" ry="60" fill="#f6c453" stroke="#6b4e16" stroke-width="6"/>
    <ellipse cx="102" cy="0" rx="102" ry="68" fill="#edb84b" stroke="#6b4e16" stroke-width="6"/>
    <circle cx="-138" cy="-16" r="8" fill="#1f2937"/><circle cx="-138" cy="16" r="8" fill="#1f2937"/>
    <path class="leg" d="M-34 -52 L-70 -114 M-18 -58 L-18 -126 M6 -58 L44 -120 M-34 52 L-70 114 M-18 58 L-18 126 M6 58 L44 120"/>
    <path d="M-166 -30 C-202 -74 -218 -92 -246 -112 M-166 30 C-202 74 -218 92 -246 112" stroke="#4a3f2f" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <g>
    <rect class="label" x="72" y="134" width="160" height="48" rx="14"/><text x="152" y="166" class="l" text-anchor="middle">Kopf</text><path class="line" d="M232 158 C304 172 332 208 346 244"/>
    <rect class="label" x="390" y="120" width="170" height="48" rx="14"/><text x="475" y="152" class="l" text-anchor="middle">Brust</text><path class="line" d="M475 168 C468 196 462 222 456 246"/>
    <rect class="label" x="686" y="136" width="190" height="48" rx="14"/><text x="781" y="168" class="l" text-anchor="middle">Hinterleib</text><path class="line" d="M686 160 C620 183 584 220 574 258"/>
    <rect class="label" x="342" y="422" width="280" height="48" rx="14"/><text x="482" y="454" class="l" text-anchor="middle">6 Beine an der Brust</text><path class="line" d="M482 422 C462 382 456 344 458 304"/>
  </g>
