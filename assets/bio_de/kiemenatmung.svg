<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Kiemenatmung beim Fisch</title>
  <desc id="desc">Deutsch beschrifteter Wasserstrom durch Mund und Kiemen.</desc>
  <rect width="960" height="540" fill="#eef8ff"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#17324a}.h{font-size:34px;font-weight:800}.l{font-size:22px;font-weight:700}.s{font-size:18px}.arrow{stroke:#1876a3;stroke-width:7;fill:none;marker-end:url(#a)}.label{fill:#fff;stroke:#7eb4ce;stroke-width:3}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1876a3"/></marker></defs>
  <text x="480" y="55" text-anchor="middle" class="h">Kiemenatmung: Sauerstoff aus dem Wasser</text>
  <g transform="translate(480 290)">
    <path d="M-300 0 C-188 -118 48 -126 210 -10 C130 120 -118 124 -300 0Z" fill="#89c2d9" stroke="#256d85" stroke-width="7"/>
    <path d="M210 -10 l100 -70 v150z" fill="#89c2d9" stroke="#256d85" stroke-width="7"/>
    <circle cx="-224" cy="-24" r="10" fill="#102a43"/>
    <path d="M-120 -70 C-58 -20 -58 36 -120 86" fill="none" stroke="#256d85" stroke-width="5"/>
    <g stroke="#e5484d" stroke-width="8" stroke-linecap="round"><line x1="-92" y1="-54" x2="-52" y2="58"/><line x1="-56" y1="-62" x2="-18" y2="62"/><line x1="-20" y1="-54" x2="16" y2="54"/></g>
  </g>
  <path d="M100 280 C190 250 260 254 334 274" class="arrow"/>
  <path d="M430 258 C542 214 604 212 690 238" class="arrow"/>
  <g>
    <rect class="label" x="72" y="156" width="270" height="54" rx="16"/><text x="207" y="190" text-anchor="middle" class="l">Wasser mit Sauerstoff</text>
    <rect class="label" x="610" y="138" width="260" height="54" rx="16"/><text x="740" y="172" text-anchor="middle" class="l">Wasser fließt hinaus</text>
    <rect class="label" x="344" y="424" width="272" height="54" rx="16"/><text x="480" y="458" text-anchor="middle" class="l">Kiemen nehmen Sauerstoff auf</text>
  </g>
