<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Kladogramm</title>
  <desc id="desc">Deutsch beschrifteter Verwandtschaftsbaum mit gemeinsamen Merkmalen.</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.h{font-size:34px;font-weight:800}.l{font-size:21px;font-weight:700}.s{font-size:17px}.branch{stroke:#475569;stroke-width:7;fill:none;stroke-linecap:round}.mark{fill:#e0f2fe;stroke:#2563eb;stroke-width:3}.tax{fill:#fff;stroke:#94a3b8;stroke-width:3}
  </style>
  <text x="480" y="55" text-anchor="middle" class="h">Kladogramm: Verwandtschaft als Modell</text>
  <g transform="translate(130 416)">
    <path class="branch" d="M0 0 H120 V-70 H250 V-140 H380 V-210 H510 V-280 H650"/>
    <path class="branch" d="M120 -70 V-10 M250 -140 V-80 M380 -210 V-150 M510 -280 V-220"/>
    <g>
      <rect class="tax" x="60" y="-8" width="120" height="42" rx="12"/><text x="120" y="20" text-anchor="middle" class="l">Fisch</text>
      <rect class="tax" x="190" y="-78" width="120" height="42" rx="12"/><text x="250" y="-50" text-anchor="middle" class="l">Frosch</text>
      <rect class="tax" x="320" y="-148" width="130" height="42" rx="12"/><text x="385" y="-120" text-anchor="middle" class="l">Eidechse</text>
      <rect class="tax" x="450" y="-218" width="120" height="42" rx="12"/><text x="510" y="-190" text-anchor="middle" class="l">Vogel</text>
      <rect class="tax" x="590" y="-288" width="120" height="42" rx="12"/><text x="650" y="-260" text-anchor="middle" class="l">Katze</text>
    </g>
    <g>
      <rect class="mark" x="18" y="22" width="174" height="36" rx="10"/><text x="105" y="46" text-anchor="middle" class="s">Wirbelsäule</text>
      <rect class="mark" x="162" y="-49" width="172" height="36" rx="10"/><text x="248" y="-25" text-anchor="middle" class="s">vier Gliedmaßen</text>
      <rect class="mark" x="296" y="-119" width="182" height="36" rx="10"/><text x="387" y="-95" text-anchor="middle" class="s">Ei mit Schale</text>
      <rect class="mark" x="438" y="-188" width="148" height="36" rx="10"/><text x="512" y="-164" text-anchor="middle" class="s">Federn</text>
      <rect class="mark" x="598" y="-330" width="112" height="36" rx="10"/><text x="654" y="-306" text-anchor="middle" class="s">Haare</text>
    </g>
  </g>
  <text x="480" y="492" text-anchor="middle" class="l">Äste zeigen gemeinsame Vorfahren, nicht besser oder schlechter.</text>
</svg>
