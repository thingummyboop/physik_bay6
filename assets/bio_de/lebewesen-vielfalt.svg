<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Vielfalt der Lebewesen</title>
  <desc id="desc">Deutsch beschriftete Übersicht verschiedener Lebewesen.</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.h{font-size:34px;font-weight:800}.l{font-size:22px;font-weight:700}.s{font-size:18px}.card{fill:#fff;stroke:#a7b7c7;stroke-width:3}.thin{stroke:#475569;stroke-width:5;stroke-linecap:round;fill:none}
  </style>
  <text x="480" y="54" text-anchor="middle" class="h">Biologie untersucht Lebewesen</text>
  <g transform="translate(78 116)">
    <g><rect class="card" width="180" height="176" rx="20"/><ellipse cx="90" cy="76" rx="58" ry="32" fill="#f6c453"/><path d="M144 76 l28 -20 v40z" fill="#f6c453"/><circle cx="56" cy="68" r="6"/><text x="90" y="138" text-anchor="middle" class="l">Tiere</text></g>
    <g transform="translate(230 0)"><rect class="card" width="180" height="176" rx="20"/><path d="M90 124 V44" stroke="#3f7d3b" stroke-width="12" stroke-linecap="round"/><ellipse cx="62" cy="74" rx="42" ry="22" fill="#65b45f" transform="rotate(-28 62 74)"/><ellipse cx="120" cy="100" rx="44" ry="22" fill="#65b45f" transform="rotate(26 120 100)"/><circle cx="90" cy="38" r="24" fill="#f59ab5"/><text x="90" y="152" text-anchor="middle" class="l">Pflanzen</text></g>
    <g transform="translate(460 0)"><rect class="card" width="180" height="176" rx="20"/><path d="M70 120 C78 82 102 82 110 120" fill="#eab676" stroke="#8b5e34" stroke-width="5"/><path d="M48 84 C64 40 116 40 132 84 C104 102 76 102 48 84Z" fill="#fca5a5" stroke="#b91c1c" stroke-width="5"/><text x="90" y="152" text-anchor="middle" class="l">Pilze</text></g>
    <g transform="translate(690 0)"><rect class="card" width="180" height="176" rx="20"/><g fill="#60a5fa"><circle cx="72" cy="70" r="18"/><circle cx="112" cy="58" r="13"/><circle cx="122" cy="98" r="16"/><circle cx="82" cy="106" r="10"/></g><text x="90" y="152" text-anchor="middle" class="l">Mikroben</text></g>
  </g>
  <g transform="translate(180 356)">
    <rect class="card" width="600" height="86" rx="20"/>
    <text x="300" y="35" text-anchor="middle" class="l">Alle Lebewesen reagieren auf ihre Umwelt</text>
    <text x="300" y="65" text-anchor="middle" class="s">und besitzen typische Merkmale des Lebens.</text>
  </g>
</svg>
