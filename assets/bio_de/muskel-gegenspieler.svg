<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Bizeps und Trizeps</title>
  <desc id="desc">Deutsch beschriftetes Gegenspieler-Prinzip von Muskeln.</desc>
  <rect width="960" height="540" fill="#fff7f3"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#351b15}.h{font-size:34px;font-weight:800}.l{font-size:22px;font-weight:700}.s{font-size:18px}.arm{stroke:#6b4a3b;stroke-width:24;stroke-linecap:round;fill:none}.muscle1{fill:#ef5b5b}.muscle2{fill:#f59e0b}.label{fill:#fff;stroke:#c97964;stroke-width:3}.line{stroke:#864c3a;stroke-width:4;fill:none}
  </style>
  <text x="480" y="55" text-anchor="middle" class="h">Muskeln arbeiten als Gegenspieler</text>
  <g transform="translate(480 280)">
    <path class="arm" d="M-210 -72 L-54 -18 L130 108"/>
    <circle cx="-54" cy="-18" r="28" fill="#f4d0b4" stroke="#6b4a3b" stroke-width="8"/>
    <path class="muscle1" d="M-182 -112 C-88 -122 -2 -86 22 -38 C-28 -48 -108 -55 -202 -25 C-216 -55 -214 -87 -182 -112Z"/>
    <path class="muscle2" d="M-188 -26 C-116 24 -22 38 78 77 C44 108 -84 76 -210 18 C-224 -4 -218 -22 -188 -26Z"/>
    <path d="M-18 -18 L128 108" stroke="#f4d0b4" stroke-width="36" stroke-linecap="round"/>
    <path d="M-18 -18 L128 108" stroke="#6b4a3b" stroke-width="8" stroke-linecap="round" opacity=".55"/>
  </g>
  <g>
    <rect class="label" x="102" y="126" width="180" height="48" rx="14"/><text x="192" y="158" class="l" text-anchor="middle">Bizeps</text><path class="line" d="M282 150 C348 150 380 172 414 194"/>
    <rect class="label" x="660" y="356" width="190" height="48" rx="14"/><text x="755" y="388" class="l" text-anchor="middle">Trizeps</text><path class="line" d="M660 380 C570 360 520 332 458 300"/>
    <rect class="label" x="300" y="444" width="360" height="52" rx="16"/><text x="480" y="477" class="l" text-anchor="middle">Einer zieht, der andere lässt nach.</text>
  </g>
</svg>
