<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Nervensystem</title>
  <desc id="desc">Deutsch beschriftetes Nervensystem vom Reiz zur Reaktion.</desc>
  <rect width="960" height="540" fill="#f6f8ff"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#20243a}.h{font-size:34px;font-weight:800}.l{font-size:22px;font-weight:700}.s{font-size:18px}.nerve{stroke:#4f46e5;stroke-width:8;stroke-linecap:round;fill:none}.box{fill:#fff;stroke:#8b8dde;stroke-width:3}.arrow{stroke:#4f46e5;stroke-width:5;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4f46e5"/></marker></defs>
  <text x="480" y="55" text-anchor="middle" class="h">Nervensystem: Reiz, Verarbeitung, Reaktion</text>
  <g transform="translate(480 102)">
    <circle cx="0" cy="38" r="34" fill="#c7d2fe" stroke="#4338ca" stroke-width="6"/>
    <path class="nerve" d="M0 74 V300"/>
    <path class="nerve" d="M0 128 C-86 160 -156 194 -230 240 M0 128 C86 160 156 194 230 240 M0 218 C-74 260 -126 296 -176 348 M0 218 C74 260 126 296 176 348"/>
  </g>
  <g transform="translate(76 160)"><rect class="box" width="210" height="84" rx="18"/><text x="105" y="34" text-anchor="middle" class="l">Sinnesorgan</text><text x="105" y="62" text-anchor="middle" class="s">nimmt Reiz auf</text></g>
  <path d="M286 202 H392" class="arrow"/>
  <g transform="translate(375 350)"><rect class="box" width="210" height="84" rx="18"/><text x="105" y="34" text-anchor="middle" class="l">Gehirn</text><text x="105" y="62" text-anchor="middle" class="s">verarbeitet</text></g>
  <path d="M584 392 H684" class="arrow"/>
  <g transform="translate(674 160)"><rect class="box" width="210" height="84" rx="18"/><text x="105" y="34" text-anchor="middle" class="l">Muskel</text><text x="105" y="62" text-anchor="middle" class="s">reagiert</text></g>
</svg>
