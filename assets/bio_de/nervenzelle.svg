    <path class="axon" d="M58 0 C188 -26 266 18 390 0 C486 -14 548 -2 630 0"/>
    <g fill="#ddd6fe" stroke="#7c3aed" stroke-width="5"><ellipse cx="170" cy="-15" rx="46" ry="22"/><ellipse cx="322" cy="11" rx="46" ry="22"/><ellipse cx="478" cy="-7" rx="46" ry="22"/></g>
    <path class="thin" d="M688 0 C720 -34 748 -52 784 -68 M688 0 C722 0 752 14 786 38 M688 0 C720 38 748 56 786 76"/>
  </g>
