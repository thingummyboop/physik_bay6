  <rect width="960" height="540" fill="#fbf8ff"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#27213a}.h{font-size:34px;font-weight:800}.l{font-size:21px;font-weight:700}.label{fill:#fff;stroke:#9b8fd6;stroke-width:3}.line{stroke:#6750a4;stroke-width:4;fill:none}.axon{stroke:#7c3aed;stroke-width:20;stroke-linecap:round;fill:none}.thin{stroke:#7c3aed;stroke-width:8;stroke-linecap:round;fill:none}
  </style>
  <text x="480" y="55" text-anchor="middle" class="h">Nervenzelle: Information weiterleiten</text>
