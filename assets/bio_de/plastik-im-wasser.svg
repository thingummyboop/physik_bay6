<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Plastik im Gewässer</title>
  <desc id="desc">Deutsch beschriftete Folgen von Plastik im Wasser.</desc>
  <rect width="960" height="540" fill="#eef8fb"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#14313d}.h{font-size:34px;font-weight:800}.l{font-size:22px;font-weight:700}.s{font-size:18px}.box{fill:#fff;stroke:#7db3c2;stroke-width:3}.arrow{stroke:#1f6f86;stroke-width:6;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1f6f86"/></marker></defs>
  <text x="480" y="56" text-anchor="middle" class="h">Plastik im Gewässer</text>
  <path d="M0 350 C120 316 232 386 360 350 S620 314 960 360 V540 H0Z" fill="#9ed7e6"/>
  <g transform="translate(92 150)">
    <rect class="box" width="210" height="104" rx="18"/><path d="M74 24 h54 l20 56 H54Z" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/><path d="M82 10 h38 v18 H82Z" fill="#93c5fd" stroke="#2563eb" stroke-width="4"/>
    <text x="105" y="142" text-anchor="middle" class="l">Plastikteil</text>
  </g>
  <path d="M320 210 H410" class="arrow"/>
  <g transform="translate(430 150)">
    <rect class="box" width="210" height="104" rx="18"/><g fill="#60a5fa"><circle cx="72" cy="54" r="10"/><circle cx="112" cy="36" r="7"/><circle cx="142" cy="66" r="9"/><circle cx="100" cy="74" r="6"/></g>
    <text x="105" y="142" text-anchor="middle" class="l">Mikroplastik</text>
  </g>
  <path d="M660 210 H750" class="arrow"/>
  <g transform="translate(770 150)">
    <rect class="box" width="120" height="104" rx="18"/><ellipse cx="56" cy="54" rx="34" ry="18" fill="#f6c453"/><path d="M88 54 l22 -16 v32z" fill="#f6c453"/><circle cx="42" cy="50" r="4" fill="#14313d"/>
    <text x="60" y="142" text-anchor="middle" class="l">Tier frisst es</text>
  </g>
  <rect class="box" x="234" y="396" width="492" height="72" rx="18"/>
  <text x="480" y="425" text-anchor="middle" class="l">Folge: Plastik bleibt lange im Lebensraum</text>
  <text x="480" y="454" text-anchor="middle" class="s">und kann in Nahrungsketten gelangen.</text>
</svg>
