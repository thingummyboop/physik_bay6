<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Hormone in der Pubertät</title>
  <desc id="desc">Deutsch beschriftetes Schema: Gehirn, Hormondrüsen und Körperveränderungen.</desc>
  <rect width="960" height="540" fill="#f8f7ff"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#292240}.h{font-size:34px;font-weight:800}.l{font-size:22px;font-weight:700}.s{font-size:18px}.box{fill:#fff;stroke:#9b8fd6;stroke-width:3}.arrow{stroke:#6750a4;stroke-width:6;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6750a4"/></marker></defs>
  <text x="480" y="56" text-anchor="middle" class="h">Pubertät: Hormone geben Signale</text>
  <g transform="translate(90 140)">
    <rect class="box" width="230" height="118" rx="18"/><circle cx="115" cy="54" r="34" fill="#c4b5fd"/><path d="M88 54 C105 30 136 32 146 58 C126 54 112 68 92 72" fill="none" stroke="#4c1d95" stroke-width="5"/>
    <text x="115" y="145" text-anchor="middle" class="l">Gehirn</text><text x="115" y="172" text-anchor="middle" class="s">startet die Steuerung</text>
  </g>
  <path d="M340 198 H430" class="arrow"/>
  <g transform="translate(450 140)">
    <rect class="box" width="230" height="118" rx="18"/><circle cx="82" cy="58" r="26" fill="#f0abfc"/><circle cx="148" cy="58" r="26" fill="#f0abfc"/><path d="M82 84 C110 112 130 112 148 84" fill="none" stroke="#7e22ce" stroke-width="6"/>
    <text x="115" y="145" text-anchor="middle" class="l">Hormondrüsen</text><text x="115" y="172" text-anchor="middle" class="s">bilden Botenstoffe</text>
  </g>
  <path d="M700 198 H790" class="arrow"/>
  <g transform="translate(720 300)">
    <rect class="box" width="180" height="86" rx="18"/><text x="90" y="35" text-anchor="middle" class="l">Körper</text><text x="90" y="64" text-anchor="middle" class="s">verändert sich</text>
  </g>
  <path d="M608 258 C622 322 660 342 720 342" class="arrow"/>
  <g transform="translate(88 342)">
    <rect class="box" width="470" height="94" rx="18"/>
    <text x="235" y="35" text-anchor="middle" class="l">Beispiele: Wachstum, Haut, Stimme, Gefühle</text>
    <text x="235" y="66" text-anchor="middle" class="s">Tempo und Reihenfolge sind individuell verschieden.</text>
  </g>
</svg>
