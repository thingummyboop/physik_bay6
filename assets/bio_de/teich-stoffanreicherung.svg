<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Stoffanreicherung im Teich</title>
  <desc id="desc">Deutsch beschriftetes Schema einer Nahrungskette im Teich.</desc>
  <rect width="960" height="540" fill="#eef8fb"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#12323d}.h{font-size:34px;font-weight:800}.l{font-size:22px;font-weight:700}.s{font-size:18px}.box{fill:#fff;stroke:#6aa7b5;stroke-width:3}.arrow{stroke:#1f6f86;stroke-width:6;fill:none;marker-end:url(#a)}.water{fill:#9ed7e6}.note{fill:#e9f7d8;stroke:#77a851;stroke-width:3}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1f6f86"/></marker></defs>
  <text x="480" y="56" text-anchor="middle" class="h">Stoffanreicherung im Teich</text>
  <path d="M50 360 C180 318 290 388 440 350 S690 318 910 368 V540 H50Z" class="water"/>
  <g transform="translate(80 110)">
    <rect class="box" x="0" y="0" width="180" height="110" rx="18"/>
    <circle cx="56" cy="58" r="22" fill="#6ab04c"/><circle cx="105" cy="48" r="16" fill="#8dd36b"/><circle cx="134" cy="72" r="12" fill="#6ab04c"/>
    <text x="90" y="140" text-anchor="middle" class="l">Algen</text>
    <text x="90" y="166" text-anchor="middle" class="s">wenig Schadstoff</text>
  </g>
  <path d="M270 166 H365" class="arrow"/>
  <g transform="translate(385 110)">
    <rect class="box" x="0" y="0" width="180" height="110" rx="18"/>
    <ellipse cx="96" cy="62" rx="52" ry="23" fill="#f6c453"/><path d="M144 62 l26 -20 v40z" fill="#f6c453"/><circle cx="66" cy="56" r="5" fill="#12323d"/>
    <text x="90" y="140" text-anchor="middle" class="l">Kleinfische</text>
    <text x="90" y="166" text-anchor="middle" class="s">mehr im Körper</text>
  </g>
  <path d="M575 166 H670" class="arrow"/>
  <g transform="translate(690 110)">
    <rect class="box" x="0" y="0" width="190" height="110" rx="18"/>
    <ellipse cx="92" cy="58" rx="65" ry="29" fill="#4d93d9"/><path d="M149 58 l34 -25 v50z" fill="#4d93d9"/><circle cx="55" cy="52" r="6" fill="#12323d"/>
    <text x="95" y="140" text-anchor="middle" class="l">Raubfisch</text>
    <text x="95" y="166" text-anchor="middle" class="s">stärkste Anreicherung</text>
  </g>
  <rect class="note" x="190" y="410" width="580" height="74" rx="18"/>
  <text x="480" y="440" text-anchor="middle" class="l">Je weiter oben in der Nahrungskette,</text>
  <text x="480" y="470" text-anchor="middle" class="l">desto stärker kann sich ein Stoff anreichern.</text>
</svg>
