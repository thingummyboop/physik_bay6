<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Wirbellose Tiere</title>
  <desc id="desc">Deutsch beschriftete Beispiele für Gruppen wirbelloser Tiere.</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.h{font-size:34px;font-weight:800}.l{font-size:21px;font-weight:700}.card{fill:#fff;stroke:#a3b3c2;stroke-width:3}.thin{stroke:#475569;stroke-width:5;stroke-linecap:round;fill:none}
  </style>
  <text x="480" y="54" text-anchor="middle" class="h">Wirbellose Tiere: Beispiele</text>
  <g transform="translate(72 112)">
    <g><rect class="card" width="180" height="160" rx="18"/><circle cx="90" cy="72" r="32" fill="#f59e0b"/><g class="thin"><line x1="58" y1="92" x2="34" y2="122"/><line x1="90" y1="104" x2="90" y2="136"/><line x1="122" y1="92" x2="146" y2="122"/></g><text x="90" y="136" text-anchor="middle" class="l">Insekten</text></g>
    <g transform="translate(226 0)"><rect class="card" width="180" height="160" rx="18"/><circle cx="72" cy="74" r="28" fill="#94a3b8"/><circle cx="112" cy="74" r="22" fill="#94a3b8"/><g stroke="#475569" stroke-width="4"><line x1="56" y1="54" x2="32" y2="26"/><line x1="128" y1="58" x2="156" y2="30"/><line x1="56" y1="94" x2="30" y2="124"/><line x1="128" y1="92" x2="154" y2="120"/></g><text x="90" y="136" text-anchor="middle" class="l">Spinnen</text></g>
    <g transform="translate(452 0)"><rect class="card" width="180" height="160" rx="18"/><path d="M40 90 C82 42 140 44 148 92 C132 116 62 118 40 90Z" fill="#fca5a5" stroke="#b91c1c" stroke-width="5"/><text x="90" y="136" text-anchor="middle" class="l">Weichtiere</text></g>
    <g transform="translate(678 0)"><rect class="card" width="180" height="160" rx="18"/><path d="M36 88 C86 46 124 52 150 90 C124 122 72 122 36 88Z" fill="#93c5fd" stroke="#2563eb" stroke-width="5"/><path d="M112 76 l48 -28 -16 54z" fill="#93c5fd" stroke="#2563eb" stroke-width="5"/><text x="90" y="136" text-anchor="middle" class="l">Krebse</text></g>
  </g>
  <g transform="translate(184 326)">
    <rect class="card" width="592" height="96" rx="18"/>
    <text x="296" y="39" text-anchor="middle" class="l">Gemeinsamkeit: keine Wirbelsäule</text>
    <text x="296" y="70" text-anchor="middle" font-size="18">Die Gruppen sind trotzdem sehr verschieden gebaut.</text>
  </g>
