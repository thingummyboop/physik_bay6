<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Gruppen der Wirbeltiere</title>
  <desc id="desc">Deutsch beschriftete Übersicht der Wirbeltiergruppen.</desc>
  <rect width="960" height="540" fill="#f7fbff"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#1e2b3a}.h{font-size:34px;font-weight:800}.l{font-size:20px;font-weight:700}.card{fill:#fff;stroke:#8ca6c7;stroke-width:3}.line{stroke:#2563eb;stroke-width:5;fill:none}
  </style>
  <text x="480" y="54" text-anchor="middle" class="h">Wirbeltiere: fünf große Gruppen</text>
  <g transform="translate(58 116)">
    <g><rect class="card" width="150" height="150" rx="18"/><ellipse cx="66" cy="64" rx="42" ry="24" fill="#93c5fd"/><path d="M102 64 l32 -22 v44z" fill="#93c5fd"/><circle cx="42" cy="58" r="5"/><text x="75" y="124" class="l" text-anchor="middle">Fische</text></g>
    <g transform="translate(188 0)"><rect class="card" width="150" height="150" rx="18"/><ellipse cx="76" cy="70" rx="46" ry="28" fill="#86efac"/><circle cx="48" cy="58" r="6"/><path class="line" d="M38 92 l-28 28 M112 92 l28 28"/><text x="75" y="124" class="l" text-anchor="middle">Amphibien</text></g>
    <g transform="translate(376 0)"><rect class="card" width="150" height="150" rx="18"/><path d="M34 74 C82 38 116 50 130 80 C104 104 62 104 34 74Z" fill="#d6a15d" stroke="#8b5e34" stroke-width="5"/><text x="75" y="124" class="l" text-anchor="middle">Reptilien</text></g>
    <g transform="translate(564 0)"><rect class="card" width="150" height="150" rx="18"/><ellipse cx="76" cy="72" rx="42" ry="30" fill="#fca5a5"/><path d="M48 64 l-34 -18 28 40z" fill="#fca5a5"/><path d="M104 64 l34 -18 -28 40z" fill="#fca5a5"/><text x="75" y="124" class="l" text-anchor="middle">Vögel</text></g>
    <g transform="translate(752 0)"><rect class="card" width="150" height="150" rx="18"/><ellipse cx="76" cy="78" rx="46" ry="30" fill="#c4a484"/><circle cx="42" cy="58" r="16" fill="#c4a484"/><circle cx="38" cy="54" r="4"/><text x="75" y="124" class="l" text-anchor="middle">Säugetiere</text></g>
  </g>
  <g transform="translate(190 342)">
    <rect class="card" width="580" height="86" rx="20"/>
    <text x="290" y="35" text-anchor="middle" font-size="22" font-weight="700">Gemeinsames Merkmal: Wirbelsäule</text>
    <text x="290" y="65" text-anchor="middle" font-size="18">Sie schützt das Rückenmark und stützt den Körper.</text>
  </g>
</svg>
