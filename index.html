<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wissenspfad</title>
    <link rel="stylesheet" href="css/style.css?v=8.6">
    <style>
        :root {
            --shell-bg: #fff3cf;
            --shell-panel: rgba(255, 252, 239, 0.9);
            --shell-border: #f2b84b;
            --shell-text: #3b2507;
            --shell-muted: #7c5c26;
            --shell-shadow: 0 18px 44px rgba(146, 64, 14, 0.16);
        }

        [data-theme="dark"] {
            --shell-bg: #071411;
            --shell-panel: rgba(15, 23, 42, 0.88);
            --shell-border: #1f4f46;
            --shell-text: #e6fffb;
            --shell-muted: #b6c7c3;
            --shell-shadow: 0 18px 44px rgba(0, 0, 0, 0.36);
        }

        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(circle at 10% 10%, rgba(255, 197, 71, 0.42), transparent 30%),
                radial-gradient(circle at 84% 16%, rgba(249, 115, 22, 0.22), transparent 28%),
                linear-gradient(135deg, #fff7d6, var(--shell-bg));
            color: var(--shell-text);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        [data-theme="dark"] body {
            background:
                radial-gradient(circle at 8% 12%, rgba(20, 184, 166, 0.18), transparent 28%),
                radial-gradient(circle at 86% 18%, rgba(132, 204, 22, 0.10), transparent 30%),
                linear-gradient(135deg, #03110f, var(--shell-bg));
        }

        .app-shell {
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 24px;
            border-bottom: 1px solid var(--shell-border);
            background: rgba(255, 248, 220, 0.82);
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
            z-index: 2;
        }

        [data-theme="dark"] .topbar { background: rgba(3, 17, 15, 0.86); }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 180px;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #f97316, #facc15);
            color: white;
            font-weight: 900;
            box-shadow: 0 10px 22px rgba(194, 65, 12, 0.24);
        }

        .brand strong { display: block; font-size: 1.05rem; }
        .brand small { color: var(--shell-muted); font-weight: 700; }

        [data-theme="dark"] .brand-mark {
            background: linear-gradient(135deg, #0f766e, #84cc16);
            box-shadow: 0 10px 22px rgba(15, 118, 110, 0.24);
        }

        .top-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .top-nav button,
        .shell-action,
        .lang-btn,
        .quiet-action {
            border: 1px solid var(--shell-border);
            border-radius: 8px;
            background: var(--shell-panel);
            color: var(--shell-text);
            padding: 9px 12px;
            cursor: pointer;
            font-weight: 700;
        }

        .top-nav button.active {
            background: #f97316;
            border-color: #f97316;
            color: white;
        }

        [data-theme="dark"] .top-nav button.active {
            background: #0f766e;
            border-color: #0f766e;
        }

        .shell-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .coin-chip {
            padding: 8px 12px;
            border-radius: 999px;
            background: #fef3c7;
            border: 1px solid #f59e0b;
            color: #78350f;
            font-weight: 900;
        }

        [data-theme="dark"] .coin-chip {
            background: #422006;
            color: #fde68a;
        }

        .language-menu {
            position: relative;
        }

        .language-toggle {
            min-width: 46px;
            padding: 8px 10px;
            text-align: center;
        }

        .theme-toggle {
            min-width: 46px;
            padding: 8px 10px;
            text-align: center;
        }

        .language-glyph {
            display: inline-block;
            font-weight: 900;
            letter-spacing: 0;
        }

        .theme-glyph {
            display: inline-block;
            font-size: 1.18rem;
            line-height: 1;
        }

        .lang-row {
            display: grid;
            gap: 4px;
        }

        .language-dropdown {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            min-width: 104px;
            z-index: 20;
            padding: 8px;
            border: 1px solid var(--shell-border);
            border-radius: 10px;
            background: var(--shell-panel);
            box-shadow: var(--shell-shadow);
        }

        .lang-btn { padding: 7px 8px; font-size: 0.78rem; }
        .lang-btn.active { background: #ffedd5; border-color: #f97316; color: #7c2d12; }
        [data-theme="dark"] .lang-btn.active { background: #d1fae5; border-color: #0f766e; color: #064e3b; }

        .workspace {
            min-height: 0;
            padding: 22px;
            overflow: hidden;
        }

        #main-view,
        #frame-shell {
            height: calc(100vh - 98px);
            overflow: auto;
        }

        #main-view {
            max-width: 1280px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        .home-hero,
        .challenge-hero,
        .home-panel,
        .challenge-map {
            background: var(--shell-panel);
            border: 1px solid var(--shell-border);
            border-radius: 16px;
            box-shadow: var(--shell-shadow);
        }

        .home-hero,
        .challenge-hero {
            padding: clamp(28px, 5vw, 58px);
            margin-bottom: 18px;
        }

        .home-hero h1,
        .challenge-hero h1 {
            font-size: clamp(2.6rem, 7vw, 6rem);
            letter-spacing: 0;
            line-height: 0.95;
            margin: 0 0 16px 0;
            color: #f97316;
        }

        [data-theme="dark"] .home-hero h1,
        [data-theme="dark"] .challenge-hero h1 { color: #5eead4; }

        .home-hero p,
        .challenge-hero p {
            max-width: 860px;
            font-size: 1.08rem;
            color: var(--shell-muted);
            margin: 0;
        }

        .eyebrow {
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 900;
            color: #c2410c !important;
            margin-bottom: 10px !important;
        }

        [data-theme="dark"] .eyebrow { color: #86efac !important; }

        .home-panel { padding: 22px; }
        .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
        .section-heading h2, .tree-header h2 { margin: 0; }
        .section-heading p { color: var(--shell-muted); margin: 0; max-width: 640px; }

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin: 18px 0 24px;
        }

        .subject-pill {
            --accent: #0f766e;
            min-height: 82px;
            border-radius: 14px;
            border: 2px solid color-mix(in srgb, var(--accent), white 55%);
            background: linear-gradient(145deg, color-mix(in srgb, var(--accent), white 88%), #ffffff);
            color: #12342f;
            cursor: pointer;
            text-align: left;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 18px rgba(15, 23, 42, 0.08);
        }

        [data-theme="dark"] .subject-pill {
            background: linear-gradient(145deg, color-mix(in srgb, var(--accent), #0f172a 76%), #111827);
            color: var(--shell-text);
        }

        .subject-pill span {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: var(--accent);
            color: white;
            font-weight: 900;
        }

        .subject-pill.active {
            border-color: var(--accent);
            outline: 3px solid color-mix(in srgb, var(--accent), transparent 70%);
        }

        .tree-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 10px 0 16px;
        }

        .learning-tree {
            display: grid;
            gap: 18px;
        }

        .tree-grade {
            border-left: 4px solid #f97316;
            padding-left: 16px;
        }

        [data-theme="dark"] .tree-grade { border-left-color: #0f766e; }

        .tree-grade h3 {
            margin: 0 0 10px;
            color: var(--shell-text);
        }

        .tree-lanes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 12px;
            position: relative;
        }

        .tree-node,
        .skill-node {
            --accent: #0f766e;
            border: 1px solid color-mix(in srgb, var(--accent), white 45%);
            background: #ffffff;
            color: #132f2a;
            border-radius: 12px;
            padding: 13px 14px;
            text-align: left;
            cursor: pointer;
            min-height: 96px;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
            position: relative;
        }

        [data-theme="dark"] .tree-node,
        [data-theme="dark"] .skill-node {
            background: #111827;
            color: var(--shell-text);
        }

        .tree-node::before,
        .skill-node::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 6px;
            border-radius: 12px 0 0 12px;
            background: var(--accent);
        }

        .tree-node.planned,
        .skill-node.planned,
        .skill-node.locked {
            opacity: 0.58;
            filter: grayscale(0.25);
        }

        .node-kicker {
            display: block;
            color: var(--accent);
            font-weight: 900;
            font-size: 0.76rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .tree-node strong,
        .skill-node strong { display: block; line-height: 1.2; }
        .tree-node small,
        .skill-node small { display: block; color: var(--shell-muted); margin-top: 8px; font-weight: 700; }

        .challenge-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .challenge-stats span {
            background: #ecfdf5;
            border: 1px solid #99f6e4;
            border-radius: 999px;
            padding: 9px 13px;
            color: #064e3b;
            font-weight: 800;
        }

        [data-theme="dark"] .challenge-stats span {
            background: #042f2e;
            color: #ccfbf1;
        }

        .challenge-map {
            padding: 22px;
            display: grid;
            gap: 22px;
        }

        .skill-branch {
            --accent: #0f766e;
            border: 1px solid color-mix(in srgb, var(--accent), white 55%);
            border-radius: 14px;
            padding: 16px;
            background: color-mix(in srgb, var(--accent), white 93%);
        }

        [data-theme="dark"] .skill-branch {
            background: color-mix(in srgb, var(--accent), #0f172a 86%);
        }

        .skill-branch header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .skill-branch header span {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            color: white;
            background: var(--accent);
            font-weight: 900;
        }

        .skill-branch h2 { margin: 0; }

        .skill-track {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .skill-node.done {
            border-color: #16a34a;
            background: #ecfdf5;
        }

        [data-theme="dark"] .skill-node.done { background: #052e1a; }

        .skill-node.done::after {
            content: "✓";
            position: absolute;
            top: 10px;
            right: 12px;
            width: 26px;
            height: 26px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #16a34a;
            color: white;
            font-weight: 900;
        }

        #frame-shell {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 12px;
        }

        .frame-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .frame-toolbar-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 1px solid var(--shell-border);
            border-radius: 12px;
            background: white;
            box-shadow: var(--shell-shadow);
        }

        [data-theme="dark"] iframe {
            background: #0f172a;
            border-color: #1f4f46;
        }

        [hidden] { display: none !important; }

        @media (max-width: 860px) {
            body { overflow: auto; }
            .topbar { align-items: flex-start; flex-direction: column; }
            .shell-actions { justify-content: flex-start; }
            #main-view, #frame-shell { height: auto; min-height: calc(100vh - 160px); }
            iframe { min-height: 76vh; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">WP</div>
                <div>
                    <strong id="app-title">Wissenspfad</strong>
                    <small>Mittelschule Wien</small>
                </div>
            </div>

            <nav class="top-nav" aria-label="Hauptnavigation">
                <button type="button" data-view="home" onclick="navigate('home')">Startseite</button>
                <button type="button" data-view="challenge" onclick="navigate('challenge')">Herausforderung</button>
            </nav>

            <div class="shell-actions">
                <span class="coin-chip"><span data-coin-count>0</span> Plus-M&uuml;nzen</span>
                <div class="language-menu" id="language-menu">
                    <button type="button" class="shell-action language-toggle" id="language-toggle" onclick="toggleLanguageMenu()" aria-label="Sprache waehlen" aria-haspopup="true" aria-expanded="false">
                        <span class="language-glyph" aria-hidden="true">A/&#25991;</span>
                    </button>
                    <div class="lang-row language-dropdown" id="language-dropdown" aria-label="Sprache waehlen" hidden>
                        <button type="button" class="lang-btn" data-lang="de" onclick="setLanguage('de')">DE</button>
                        <button type="button" class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
                        <button type="button" class="lang-btn" data-lang="ar" onclick="setLanguage('ar')">AR</button>
                        <button type="button" class="lang-btn" data-lang="uk" onclick="setLanguage('uk')">UK</button>
                        <button type="button" class="lang-btn" data-lang="sr" onclick="setLanguage('sr')">SR</button>
                        <button type="button" class="lang-btn" data-lang="tr" onclick="setLanguage('tr')">TR</button>
                    </div>
                </div>
                <button type="button" class="shell-action theme-toggle" id="dark-mode-toggle" onclick="toggleDarkMode()" aria-label="Waldmodus aktivieren" title="Waldmodus aktivieren"><span class="theme-glyph" aria-hidden="true">&#127794;</span></button>
                <button type="button" class="shell-action" onclick="resetAllProgress()">Reset</button>
            </div>
        </header>

        <main class="workspace">
            <div id="main-view"></div>
            <div id="frame-shell" hidden>
                <div class="frame-toolbar">
                    <button type="button" class="quiet-action" onclick="backToShell()">Zur&uuml;ck</button>
                    <div class="frame-toolbar-group">
                        <button type="button" class="quiet-action" id="frame-practice-reset" onclick="resetCurrentTopicPractice()" hidden>&Uuml;bungsfragen zur&uuml;cksetzen</button>
                    </div>
                </div>
                <iframe id="game-frame" name="game-frame" title="Kapitel"></iframe>
            </div>
        </main>
    </div>

    <script src="js/curriculum.js?v=1.0"></script>
    <script src="js/app_shell.js?v=1.7"></script>
</body>
</html>
