<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 Das große Physik-Abenteuer (MS/AHS Unterstufe)</title>
    <link rel="stylesheet" href="css/style.css?v=2.0">
    <style>
        :root {
            --sidebar-bg: #0f172a;
            --main-bg: #1e293b;
            --text-color: white;
            --nav-btn-color: #cbd5e0;
            --nav-btn-active-bg: #1e293b;
            --nav-btn-active-border: #3b82f6;
            --nav-btn-active-text: #60a5fa;
            --header-gradient: linear-gradient(135deg, #3b82f6, #2563eb);
            --header-border: #1e40af;
        }

        [data-theme="dark"] {
            --sidebar-bg: #000000;
            --main-bg: #0a0a0a;
            --text-color: black;
            --nav-btn-color: #a0aec0;
            --nav-btn-active-bg: #121212;
            --nav-btn-active-border: #2196F3;
            --nav-btn-active-text: #64b5f6;
            --header-gradient: linear-gradient(135deg, #1e3a8a, #1e40af);
            --header-border: #172554;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background-color: var(--main-bg); color: var(--text-color); overflow: hidden; transition: background-color 0.3s, color 0.3s; }
        #sidebar { width: 320px; background-color: var(--sidebar-bg); overflow-y: auto; display: flex; flex-direction: column; transition: margin-left 0.3s, background-color 0.3s; box-shadow: 4px 0 15px rgba(0,0,0,0.3); z-index: 10; }
        #sidebar.collapsed { margin-left: -320px; }
        .sidebar-header { padding: 60px 20px 20px 20px; text-align: center; background: var(--header-gradient); border-bottom: 2px solid var(--header-border); }
        .sidebar-header h1 { margin: 10px 0; font-size: 1.4em; text-shadow: 0 2px 4px rgba(0,0,0,0.3); color: white; }
        .grade-section { padding: 15px 20px 5px 20px; font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; border-bottom: 1px solid #334155; margin-top: 10px; font-weight: bold; }
        .nav-btn { background: transparent; color: var(--nav-btn-color); border: none; width: 100%; text-align: left; padding: 12px 20px; cursor: pointer; border-left: 4px solid transparent; transition: all 0.2s; font-size: 0.95em; }
        .nav-btn:hover, .nav-btn.active { background-color: var(--nav-btn-active-bg); color: var(--text-color); border-left: 4px solid var(--nav-btn-active-border); }
        .nav-btn.active { color: var(--nav-btn-active-text); font-weight: bold; }
        #content-area { flex-grow: 1; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background-color: white; }
        #zeugnis-btn { position: fixed; top: 8px; right: 20px; z-index: 1000; background: linear-gradient(135deg, #FFD700, #FF9800); padding: 10px 20px; border-radius: 50px; cursor: pointer; font-weight: bold; border: 2px solid white; color: #1e293b; box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4); display: flex; align-items: center; gap: 8px; transition: transform 0.2s; }
        #zeugnis-btn:hover { transform: scale(1.05); }
        #menu-toggle { position: fixed; top: 15px; left: 15px; z-index: 100; background: #3b82f6; color: white; border: none; padding: 10px 12px; border-radius: 5px; cursor: pointer; }
        .lang-btn { background: #334155; color: white; border: 1px solid #475569; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8em; }
        .lang-btn.active { background: #3b82f6; border-color: #60a5fa; }
    </style>
</head>
<body>
    <button id="menu-toggle" onclick="toggleMenu()" aria-label="Menü umschalten" aria-expanded="true">☰</button>
    <button id="zeugnis-btn" onclick="loadPage('topics/dashboard.html', null)">🎓 Mein Zeugnis</button>
    <div id="sidebar">
        <div class="sidebar-header">
            <div style="display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; padding: 5px 0 15px 0;">
                <button onclick="setLanguage('de')" class="lang-btn" id="lang-de" title="Deutsch">DE</button>
                <button onclick="setLanguage('en')" class="lang-btn" id="lang-en" title="English">EN</button>
                <button onclick="setLanguage('ar')" class="lang-btn" id="lang-ar" title="العربية">AR</button>
                <button onclick="setLanguage('uk')" class="lang-btn" id="lang-uk" title="Українська">UK</button>
                <button onclick="setLanguage('sr')" class="lang-btn" id="lang-sr" title="Српски">SR</button>
                <button onclick="setLanguage('tr')" class="lang-btn" id="lang-tr" title="Türkçe">TR</button>
            </div>
            <h1>🚀 Physik-Abenteuer</h1>
            <div style="margin-top: 10px; background: #1e293b; padding: 15px; border-radius: 12px; border: 1px solid #3b82f6; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);">
                <div style="font-size: 1.2em; font-weight: bold; color: #fbbf24; margin-bottom: 10px; text-align: center;">
                    🏆 <span id="global-score-val">0</span> Punkte
                </div>
                <div style="display: flex; gap: 5px;">
                    <button onclick="toggleDarkMode()" id="dark-mode-toggle" style="flex: 1; background: #475569; font-size: 0.75em; padding: 8px; border: none; color: white; border-radius: 6px; cursor: pointer;">Nachtmodus 🌙</button>
                    <button onclick="resetProgress()" style="flex: 1; background: #e53e3e; font-size: 0.75em; padding: 8px; border: none; color: white; border-radius: 6px; cursor: pointer;">Reset 🔄</button>
                </div>
            </div>
        </div>
        
                <div style="padding: 10px 20px;">
            <select id="subject-select" onchange="renderNav()" style="width: 100%; padding: 8px; border-radius: 6px; background: var(--main-bg); color: var(--text-color); border: 1px solid var(--nav-btn-active-border); outline: none; margin-bottom: 10px; font-weight: bold; cursor: pointer;">
                <option value="physik">🚀 Physik</option>
                <option value="geographie">🌍 Geographie & Umwelt</option>
                <option value="dgb">💻 Digitale Grundbildung</option>
                <option value="chemie">🧪 Chemie</option>
                <option value="biologie">🧬 Biologie</option>
                <option value="mathematik">📐 Mathematik</option>
            </select>
            <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                <button id="sort-grade-btn" onclick="setSortMode('grade')" style="flex: 1; padding: 6px; border-radius: 4px; border: none; background: var(--nav-btn-active-border); color: white; cursor: pointer; font-size: 0.85em;">Nach Schuljahr</button>
                <button id="sort-topic-btn" onclick="setSortMode('topic')" style="flex: 1; padding: 6px; border-radius: 4px; border: none; background: var(--nav-btn-active-bg); color: var(--nav-btn-color); cursor: pointer; font-size: 0.85em;">Nach Thema</button>
            </div>
        </div>

        <button class="nav-btn" data-page="topics/start.html" onclick="loadPage('topics/start.html', this)" style="font-weight: bold; color: var(--nav-btn-active-text);">🏠 Startseite</button>
        <button class="nav-btn" data-page="topics/glossar.html" onclick="loadPage('topics/glossar.html', this)" style="margin-bottom: 10px;">📖 Glossar</button>
        
        <div id="dynamic-nav-container"></div>
    </div>
    <div id="content-area"><iframe id="game-frame" name="game-frame" title="Physik Spiel"></iframe></div>
    
    <script>

        window.addEventListener('message', (e) => {
            if (e.data.type === 'updateScore') {
                document.getElementById('global-score-val').innerText = e.data.score;
            }
            if (e.data.type === 'navigate') {
                loadPage(e.data.page, null);
            }
        });

        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.getElementById('menu-toggle');
            sidebar.classList.toggle('collapsed');
            const isCollapsed = sidebar.classList.contains('collapsed');
            toggle.setAttribute('aria-expanded', !isCollapsed);
        }

        function setLanguage(l) {
            localStorage.setItem('physik_lang', l);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('lang-' + l);
            if (btn) btn.classList.add('active');
            
            // Reload current iframe if it's already loading something
            const frame = document.getElementById('game-frame');
            if (frame.src && frame.src !== 'about:blank') {
                frame.contentWindow.location.reload();
            }
        }

                    { id: "math4_2_pythagoras", title: "📐 2. Satz des Pythagoras", grade: "4. Klasse (8. Schulstufe)", category: "Geometrie" },
                    { id: "math4_3_terme_gleichungen", title: "🧮 3. Terme und Gleichungen", grade: "4. Klasse (8. Schulstufe)", category: "Algebra" },

        let currentSortMode = 'grade';

        function setSortMode(mode) {
            currentSortMode = mode;
            document.getElementById('sort-grade-btn').style.background = mode === 'grade' ? 'var(--nav-btn-active-border)' : 'var(--nav-btn-active-bg)';
            document.getElementById('sort-grade-btn').style.color = mode === 'grade' ? 'white' : 'var(--nav-btn-color)';
            document.getElementById('sort-topic-btn').style.background = mode === 'topic' ? 'var(--nav-btn-active-border)' : 'var(--nav-btn-active-bg)';
            document.getElementById('sort-topic-btn').style.color = mode === 'topic' ? 'white' : 'var(--nav-btn-color)';
            renderNav();
        }

        function renderNav() {
            const subject = document.getElementById('subject-select').value;
            const container = document.getElementById('dynamic-nav-container');
            container.innerHTML = '';
            
            const items = curriculum[subject].topics;
            
            if (items.length === 0) {
                container.innerHTML = '<div style="padding: 20px; color: #94a3b8; text-align: center; font-style: italic; font-size: 0.9em;">Inhalte für dieses Fach folgen in Kürze! 🚧</div>';
                return;
            }

            const groups = {};
            items.forEach(item => {
                const key = currentSortMode === 'grade' ? item.grade : item.category;
                if (!groups[key]) groups[key] = [];
                groups[key].push(item);
            });

            for (const [groupName, groupItems] of Object.entries(groups)) {
                const header = document.createElement('div');
                header.className = 'grade-section';
                header.innerText = currentSortMode === 'grade' ? '📚 ' + groupName : '📂 ' + groupName;
                container.appendChild(header);

                groupItems.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = 'nav-btn';
                    btn.setAttribute('data-page', item.id);
                    btn.onclick = function() { loadPage(item.id, this); };
                    btn.innerText = item.title;
                    container.appendChild(btn);
                });
            }

            const currentPage = localStorage.getItem('physik_current_page');
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.getAttribute('data-page') === currentPage) {
                    btn.classList.add('active');
                }
            });
        }

        function loadPage(page, button, fromHash = false) {
            localStorage.setItem('physik_current_page', page);
            let url = page;

            // Update URL hash for bookmarking (unless triggered by hashchange already)
            if (!fromHash) {
                window.location.hash = page;
            }

            // Mapping for simple topic IDs to template URL
            if (!page.includes('/') && !page.includes('.html')) {
                url = `topics/template.html?topic=${encodeURIComponent(page)}`;
            } else if (page.startsWith('topics/') && !['dashboard', 'glossar', 'template', 'start'].some(x => page.includes(x))) {
                const topicId = page.replace('topics/', '').replace('.html', '').replace(/[\s,]+/g, '_');
                url = `topics/template.html?topic=${encodeURIComponent(topicId)}`;
            }

            const frame = document.getElementById('game-frame');
            if (frame.src !== window.location.origin + '/' + url && !frame.src.endsWith(url)) {
                frame.src = url;
            }

            // Highlight active button
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if (button) {
                button.classList.add('active');
                frame.title = "Aktuelles Thema: " + button.innerText.trim();
            } else {
                // Find button by page name if navigated via code or hash
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    const pageAttr = btn.getAttribute('data-page');
                    if (pageAttr === page) {
                        btn.classList.add('active');
                        frame.title = "Aktuelles Thema: " + btn.innerText.trim();
                    }
                });
            }
        }

        function toggleDarkMode() {
            let isDark = localStorage.getItem('physik_dark_mode') === 'true';
            isDark = !isDark;
            localStorage.setItem('physik_dark_mode', isDark);
            applyTheme(isDark);
        }

        function applyTheme(isDark) {
            const btn = document.getElementById('dark-mode-toggle');
            if (isDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
                btn.innerHTML = "Tagmodus ☀️";
            } else {
                document.documentElement.removeAttribute('data-theme');
                btn.innerHTML = "Nachtmodus 🌙";
            }
            
            // Notify iframe about theme change
            const frame = document.getElementById('game-frame');
            if (frame.contentWindow) {
                frame.contentWindow.postMessage({ type: 'themeChange', isDark: isDark }, '*');
            }
        }

        function resetProgress() {
            if (confirm("Möchtest du wirklich deinen gesamten Fortschritt, alle Punkte und gelösten Aufgaben löschen?")) {
                localStorage.clear();
                location.reload();
            }
        }

        // Handle browser back/forward buttons
        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.substring(1);
            if (hash) {
                loadPage(hash, null, true);
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            // Restore Score
            document.getElementById('global-score-val').innerText = localStorage.getItem('physik_score') || 0;
            
            // Restore Language
            const lang = localStorage.getItem('physik_lang') || 'de';
            setLanguage(lang);
            
            // Restore Theme
            const isDark = localStorage.getItem('physik_dark_mode') === 'true';
            applyTheme(isDark);
            
            // Restore Page (Prefer Hash -> LocalStorage -> Default)
            const hashPage = window.location.hash.substring(1);
            const savedPage = hashPage || localStorage.getItem('physik_current_page') || 'topics/start.html';
            renderNav();
            loadPage(savedPage, null);
        });
    </script>
</body>
</html>
