<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SciVerse</title>
    <link rel="stylesheet" href="css/style.css?v=8.6">
    <style>
        :root {
            --shell-bg: #fff3cf;
            --shell-panel: rgba(255, 252, 239, 0.9);
            --shell-border: #f2b84b;
            --shell-text: #3b2507;
            --shell-muted: #7c5c26;
            --shell-shadow: 0 18px 44px rgba(146, 64, 14, 0.16);
            --neon-glow: 0 0 15px rgba(249, 115, 22, 0.5);
        }

        [data-theme="dark"] {
            --shell-bg: #071411;
            --shell-panel: rgba(15, 23, 42, 0.88);
            --shell-border: #1f4f46;
            --shell-text: #e6fffb;
            --shell-muted: #b6c7c3;
            --shell-shadow: 0 18px 44px rgba(0, 0, 0, 0.5);
            --neon-glow: 0 0 15px rgba(20, 184, 166, 0.5);
        }

        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(circle at 10% 10%, rgba(255, 197, 71, 0.42), transparent 30%),
                radial-gradient(circle at 84% 16%, rgba(249, 115, 22, 0.22), transparent 28%),
                linear-gradient(135deg, #fff7d6, var(--shell-bg));
            color: var(--shell-text);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        [data-theme="dark"] body {
            background:
                radial-gradient(circle at 8% 12%, rgba(20, 184, 166, 0.18), transparent 28%),
                radial-gradient(circle at 86% 18%, rgba(132, 204, 22, 0.10), transparent 30%),
                linear-gradient(135deg, #03110f, var(--shell-bg));
        }

        .app-shell {
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 24px;
            border-bottom: 1px solid var(--shell-border);
            background: rgba(255, 248, 220, 0.82);
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
            z-index: 2;
        }

        [data-theme="dark"] .topbar { background: rgba(3, 17, 15, 0.86); }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 180px;
        }

        .brand-mark {
            border: 0;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #f97316, #facc15);
            color: white;
            font-weight: 900;
            font-size: 1.2rem;
            padding: 0;
            box-shadow: var(--neon-glow);
            transform: rotate(-3deg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .brand-mark:hover {
            transform: rotate(3deg) scale(1.05);
            box-shadow: 0 0 25px rgba(249, 115, 22, 0.8);
        }

        .brand-mark:focus-visible {
            outline: 3px solid #facc15;
            outline-offset: 3px;
        }

        .brand strong { 
            display: block; 
            font-size: 1.3rem; 
            font-weight: 900;
            background: linear-gradient(90deg, #ea580c, #ca8a04);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        
        [data-theme="dark"] .brand strong {
            background: linear-gradient(90deg, #2dd4bf, #a3e635);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand small { color: var(--shell-muted); font-weight: 700; text-transform: uppercase; font-size: 0.65rem; letter-spacing: 1px;}

        [data-theme="dark"] .brand-mark {
            background: linear-gradient(135deg, #0d9488, #84cc16);
            box-shadow: var(--neon-glow);
        }

        [data-theme="dark"] .brand-mark:hover {
            box-shadow: 0 0 25px rgba(20, 184, 166, 0.8);
        }

        .top-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .top-nav button,
        .shell-action,
        .lang-btn,
        .quiet-action {
            border: 1px solid var(--shell-border);
            border-radius: 8px;
            background: var(--shell-panel);
            color: var(--shell-text);
            padding: 9px 12px;
            cursor: pointer;
            font-weight: 700;
        }

        .top-nav button.active {
            background: #f97316;
            border-color: #f97316;
            color: white;
        }

        [data-theme="dark"] .top-nav button.active {
            background: #0f766e;
            border-color: #0f766e;
        }

        .shell-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .coin-chip {
            padding: 8px 12px;
            border-radius: 999px;
            background: #fef3c7;
            border: 1px solid #f59e0b;
            color: #78350f;
            font-weight: 900;
        }

        [data-theme="dark"] .coin-chip {
            background: #422006;
            color: #fde68a;
        }

        .language-menu {
            position: relative;
        }

        .language-toggle {
            min-width: 46px;
            padding: 8px 10px;
            text-align: center;
        }

        .theme-toggle {
            min-width: 46px;
            padding: 8px 10px;
            text-align: center;
        }

        .language-glyph {
            display: inline-block;
            font-weight: 900;
            letter-spacing: 0;
        }

        .theme-glyph {
            display: inline-block;
            font-size: 1.18rem;
            line-height: 1;
        }

        .lang-row {
            display: grid;
            gap: 4px;
        }

        .language-dropdown {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            min-width: 104px;
            z-index: 20;
            padding: 8px;
            border: 1px solid var(--shell-border);
            border-radius: 10px;
            background: var(--shell-panel);
            box-shadow: var(--shell-shadow);
        }

        .lang-btn { padding: 7px 8px; font-size: 0.78rem; }
        .lang-btn.active { background: #ffedd5; border-color: #f97316; color: #7c2d12; }
        [data-theme="dark"] .lang-btn.active { background: #d1fae5; border-color: #0f766e; color: #064e3b; }

        .workspace {
            min-height: 0;
            padding: 22px;
            overflow: hidden;
        }

        #main-view,
        #frame-shell {
            height: calc(100vh - 98px);
            overflow: auto;
        }

        #main-view {
            max-width: 1280px;
            margin: 0 auto;
            padding-bottom: 80px;
            scrollbar-width: none;
            width: 100%;
        }

        #main-view::-webkit-scrollbar {
            display: none;
        }

        #main-view[data-shell-view="challenge"] {
            max-width: min(1880px, calc(100vw - 44px));
        }

        #main-view[data-shell-view="character"] {
            max-width: min(1680px, calc(100vw - 44px));
        }

        .home-hero,
        .challenge-hero,
        .character-hero,
        .home-panel,
        .challenge-map {
            background: var(--shell-panel);
            border: 1px solid var(--shell-border);
            border-radius: 16px;
            box-shadow: var(--shell-shadow);
        }

        .home-hero,
        .challenge-hero,
        .character-hero {
            padding: clamp(28px, 5vw, 58px);
            margin-bottom: 18px;
        }

        #main-view[data-shell-view="challenge"] .challenge-hero {
            margin-bottom: clamp(10px, 1.8vh, 18px);
            padding: clamp(16px, 2.25vw, 32px);
        }

        .home-hero h1,
        .challenge-hero h1,
        .character-hero h1 {
            font-size: clamp(2.6rem, 7vw, 6rem);
            letter-spacing: 0;
            line-height: 0.95;
            margin: 0 0 16px 0;
            color: #f97316;
        }

        #main-view[data-shell-view="challenge"] .challenge-hero h1 {
            font-size: clamp(2.25rem, min(4.9vw, 6.8vh), 4.4rem);
            margin-bottom: clamp(8px, 1.4vh, 14px);
        }

        [data-theme="dark"] .home-hero h1,
        [data-theme="dark"] .challenge-hero h1,
        [data-theme="dark"] .character-hero h1 { color: #5eead4; }

        .home-hero p,
        .challenge-hero p,
        .character-hero p {
            max-width: 860px;
            font-size: 1.08rem;
            color: var(--shell-muted);
            margin: 0;
        }

        #main-view[data-shell-view="challenge"] .challenge-hero p {
            font-size: clamp(0.94rem, 1.1vw, 1.02rem);
            line-height: 1.5;
            max-width: min(860px, 78vw);
        }

        .eyebrow {
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 900;
            color: #c2410c !important;
            margin-bottom: 10px !important;
        }

        [data-theme="dark"] .eyebrow { color: #86efac !important; }

        @media (max-height: 820px) {
            #main-view[data-shell-view="challenge"] .challenge-hero {
                padding: clamp(14px, 2.1vw, 26px);
            }

            #main-view[data-shell-view="challenge"] .challenge-hero h1 {
                font-size: clamp(2.05rem, min(4.6vw, 6.3vh), 3.6rem);
            }

            #main-view[data-shell-view="challenge"] .eyebrow {
                margin-bottom: 6px !important;
            }
        }

        @media (max-width: 720px) {
            #main-view[data-shell-view="challenge"] .challenge-hero {
                padding: 18px;
            }

            #main-view[data-shell-view="challenge"] .challenge-hero h1 {
                font-size: clamp(2.1rem, 12vw, 3.5rem);
            }

            #main-view[data-shell-view="challenge"] .challenge-hero p {
                max-width: 100%;
            }
        }

        .home-panel { padding: 22px; }
        .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
        .section-heading h2, .tree-header h2 { margin: 0; }
        .section-heading p { color: var(--shell-muted); margin: 0; max-width: 640px; }

        .subject-grid {
            min-height: 278px;
            margin: 18px 0 24px;
            position: relative;
        }

        .subject-grid::before {
            content: "";
            position: absolute;
            inset: 18px 6% 16px 6%;
            border-radius: 999px;
            background:
                radial-gradient(circle at 20% 30%, color-mix(in srgb, #f97316, transparent 76%), transparent 28%),
                radial-gradient(circle at 68% 42%, color-mix(in srgb, #0f766e, transparent 78%), transparent 32%);
            opacity: 0.72;
            pointer-events: none;
        }

        [data-theme="dark"] .subject-grid::before { opacity: 0.42; }

        .subject-pill {
            --accent: #0f766e;
            align-items: center;
            backdrop-filter: blur(10px);
            background: radial-gradient(circle at 32% 24%, rgba(255,255,255,0.96), color-mix(in srgb, var(--accent), white 76%) 34%, var(--accent) 112%);
            border: 2px solid color-mix(in srgb, var(--accent), transparent 60%);
            border-radius: 999px;
            box-shadow: 0 10px 22px color-mix(in srgb, var(--accent), transparent 78%);
            color: var(--accent);
            cursor: pointer;
            display: flex;
            height: 74px;
            justify-content: center;
            min-height: 74px;
            overflow: visible;
            padding: 0;
            position: absolute;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 74px;
            z-index: 1;
        }

        .subject-pill:nth-child(1) { left: 7%; top: 18px; }
        .subject-pill:nth-child(2) { left: 22%; top: 58px; }
        .subject-pill:nth-child(3) { left: 37%; top: 14px; }
        .subject-pill:nth-child(4) { left: 52%; top: 62px; }
        .subject-pill:nth-child(5) { left: 67%; top: 20px; }
        .subject-pill:nth-child(6) { left: 80%; top: 70px; }
        .subject-pill:nth-child(7) { left: 13%; top: 158px; }
        .subject-pill:nth-child(8) { left: 29%; top: 128px; }
        .subject-pill:nth-child(9) { left: 45%; top: 168px; }
        .subject-pill:nth-child(10) { left: 61%; top: 132px; }
        .subject-pill:nth-child(11) { left: 76%; top: 176px; }

        .subject-pill:hover {
            border-color: var(--accent);
            box-shadow: 0 12px 25px color-mix(in srgb, var(--accent), transparent 70%);
            transform: translateY(-5px) scale(1.08);
        }

        .subject-pill::before {
            content: attr(data-label);
            position: absolute;
            left: 50%;
            top: calc(100% + 8px);
            transform: translateX(-50%) translateY(-4px);
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            border-radius: 999px;
            background: var(--shell-panel);
            border: 1px solid var(--shell-border);
            color: var(--shell-text);
            font-size: 0.76rem;
            font-weight: 900;
            padding: 5px 9px;
            transition: opacity 0.18s ease, transform 0.18s ease;
            z-index: 3;
        }

        .subject-pill:hover::before,
        .subject-pill:focus-visible::before {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .subject-pill::after {
            content: "";
            position: absolute;
            inset: 9px;
            border-radius: inherit;
            background: rgba(255,255,255,0.74);
            z-index: -1;
        }

        [data-theme="dark"] .subject-pill {
            background: radial-gradient(circle at 32% 24%, color-mix(in srgb, var(--accent), white 38%), color-mix(in srgb, var(--accent), #0f172a 58%) 42%, #0f172a 114%);
            border-color: color-mix(in srgb, var(--accent), transparent 70%);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            color: #f8fafc;
        }

        [data-theme="dark"] .subject-pill::after {
            background: rgba(15, 23, 42, 0.62);
        }

        .subject-symbol {
            display: grid;
            font-size: 1.42rem;
            font-weight: 900;
            height: 54px;
            line-height: 1;
            place-items: center;
            transition: transform 0.3s ease;
            width: 54px;
        }

        .subject-symbol svg {
            display: block;
            height: 46px;
            overflow: visible;
            width: 46px;
        }

        .subject-pill[data-subject="physik"] .subject-symbol {
            font-size: 2.65rem;
            height: 60px;
            width: 60px;
        }

        .subject-pill[data-subject="mathematik"] .subject-symbol {
            font-size: 1rem;
            letter-spacing: 0;
        }

        .subject-symbol .math-ops-icon {
            color: color-mix(in srgb, var(--accent), #3b0764 24%);
            filter: drop-shadow(0 3px 0 rgba(255, 255, 255, 0.74));
            height: 48px;
            width: 48px;
        }

        .subject-symbol .chem-flask-icon {
            color: color-mix(in srgb, var(--accent), #064e3b 18%);
            filter: drop-shadow(0 3px 0 rgba(255, 255, 255, 0.68));
            height: 49px;
            width: 49px;
        }

        .subject-symbol .uk-flag-icon {
            border-radius: 6px;
            box-shadow: 0 2px 0 rgba(255, 255, 255, 0.8), 0 0 0 2px rgba(255, 255, 255, 0.72);
            height: 34px;
            overflow: hidden;
            width: 50px;
        }

        .subject-pill[data-subject="englisch"] .subject-symbol,
        .subject-pill[data-subject="geographie"] .subject-symbol,
        .subject-pill[data-subject="kunst"] .subject-symbol,
        .subject-pill[data-subject="ernaehrung"] .subject-symbol,
        .subject-pill[data-subject="biologie"] .subject-symbol,
        .subject-pill[data-subject="dgb"] .subject-symbol {
            font-size: 1.7rem;
        }

        .subject-pill:hover .subject-symbol {
            transform: scale(1.1) rotate(3deg);
        }

        [data-theme="dark"] .math-ops-icon,
        [data-theme="dark"] .chem-flask-icon {
            filter: drop-shadow(0 3px 0 rgba(15, 23, 42, 0.7));
        }

        [data-theme="dark"] .uk-flag-icon {
            box-shadow: 0 0 0 2px rgba(248, 250, 252, 0.55), 0 8px 16px rgba(0, 0, 0, 0.22);
        }

        .subject-label {
            border: 0;
            clip: rect(0 0 0 0);
            height: 1px;
            margin: -1px;
            overflow: hidden;
            padding: 0;
            position: absolute;
            width: 1px;
        }

        .subject-pill.active {
            border-color: var(--accent);
            box-shadow:
                0 0 0 4px color-mix(in srgb, var(--accent), transparent 64%),
                0 16px 28px color-mix(in srgb, var(--accent), transparent 72%);
        }

        .tree-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 10px 0 22px;
        }

        .learning-tree {
            display: grid;
            gap: 30px;
            padding-left: 68px;
            position: relative;
        }

        .learning-tree::before {
            content: "";
            position: absolute;
            left: 26px;
            top: 14px;
            bottom: 18px;
            width: 6px;
            border-radius: 999px;
            background: linear-gradient(180deg, #f97316, #facc15);
            box-shadow: 0 0 0 5px color-mix(in srgb, #f97316, transparent 84%);
        }

        [data-theme="dark"] .learning-tree::before {
            background: linear-gradient(180deg, #0f766e, #84cc16);
            box-shadow: 0 0 0 5px color-mix(in srgb, #0f766e, transparent 80%);
        }

        .tree-grade {
            border: 1px solid color-mix(in srgb, #f97316, transparent 70%);
            border-radius: 14px;
            padding: 18px;
            position: relative;
            background: rgba(255, 255, 255, 0.32);
            box-shadow: 0 10px 24px rgba(146, 64, 14, 0.08);
        }

        .tree-grade::before {
            content: "";
            position: absolute;
            left: -42px;
            top: 31px;
            width: 42px;
            height: 4px;
            border-radius: 999px;
            background: #f97316;
        }

        .tree-grade::after {
            content: "";
            position: absolute;
            left: -50px;
            top: 22px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #facc15;
            border: 4px solid #f97316;
        }

        [data-theme="dark"] .tree-grade {
            border-color: color-mix(in srgb, #0f766e, transparent 55%);
            background: rgba(15, 23, 42, 0.42);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
        }

        [data-theme="dark"] .tree-grade::before { background: #0f766e; }
        [data-theme="dark"] .tree-grade::after {
            background: #84cc16;
            border-color: #0f766e;
        }

        .tree-grade h3 {
            margin: 0 0 14px;
            color: var(--shell-text);
        }

        .tree-lanes {
            display: grid;
            gap: 16px;
        }

        .strand-branch {
            --accent: #0f766e;
            align-items: stretch;
            display: grid;
            grid-template-columns: minmax(112px, 150px) 1fr;
            gap: 14px;
            position: relative;
        }

        .strand-branch::before {
            content: "";
            position: absolute;
            left: 128px;
            right: 0;
            top: 26px;
            height: 2px;
            background: color-mix(in srgb, var(--accent), transparent 62%);
        }

        .strand-label {
            align-self: start;
            border: 1px solid color-mix(in srgb, var(--accent), transparent 48%);
            border-radius: 999px;
            color: var(--accent);
            font-size: 0.82rem;
            font-weight: 900;
            padding: 9px 12px;
            text-align: center;
            background: color-mix(in srgb, var(--accent), white 90%);
            position: relative;
            z-index: 1;
        }

        [data-theme="dark"] .strand-label {
            background: color-mix(in srgb, var(--accent), #0f172a 78%);
        }

        .strand-nodes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .tree-node,
        .skill-node {
            --accent: #0f766e;
            border: 1px solid color-mix(in srgb, var(--accent), white 45%);
            background: #ffffff;
            color: #132f2a;
            border-radius: 12px;
            padding: 13px 14px;
            text-align: left;
            cursor: pointer;
            min-height: 96px;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
            position: relative;
        }

        [data-theme="dark"] .tree-node,
        [data-theme="dark"] .skill-node {
            background: #111827;
            color: var(--shell-text);
        }

        .tree-node::before,
        .skill-node::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 6px;
            border-radius: 12px 0 0 12px;
            background: var(--accent);
        }

        .tree-node.planned,
        .tree-node.locked,
        .skill-node.planned,
        .skill-node.locked {
            opacity: 0.58;
            filter: grayscale(0.25);
        }

        .tree-node:disabled,
        .skill-node:disabled {
            cursor: not-allowed;
        }

        .node-kicker {
            display: block;
            color: var(--accent);
            font-weight: 900;
            font-size: 0.76rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .tree-node strong,
        .skill-node strong { display: block; line-height: 1.2; }
        .tree-node small,
        .skill-node small { display: block; color: var(--shell-muted); margin-top: 8px; font-weight: 700; }

        .challenge-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: clamp(9px, 1.35vh, 14px);
        }

        .challenge-stats span {
            background: #ecfdf5;
            border: 1px solid #99f6e4;
            border-radius: 999px;
            padding: clamp(6px, 0.95vh, 8px) 12px;
            color: #064e3b;
            font-weight: 800;
        }

        [data-theme="dark"] .challenge-stats span {
            background: #042f2e;
            color: #ccfbf1;
        }

        .challenge-map {
            display: block;
            padding: 0;
        }

        #main-view[data-shell-view="challenge"] .challenge-map {
            background: transparent;
            border-color: transparent;
            box-shadow: none;
            padding: 0;
        }

        .radial-skill-scroll {
            cursor: grab;
            height: min(78vh, 860px);
            min-height: 560px;
            overflow: auto;
            outline: none;
            padding: 6px 0 18px;
            scrollbar-width: none;
            touch-action: none;
        }

        .radial-skill-scroll.is-dragging {
            cursor: grabbing;

        .radial-node {

                inset -6px -8px 12px rgba(15, 23, 42, 0.2),

                0 0 0 calc(2px * var(--orb-scale)) color-mix(in srgb, var(--accent), transparent 76%),

            min-width: 150px;

            padding: 9px 11px;

            position: absolute;
            text-align: left;

            transform: translate(-50%, -6px) scale(0.96);
            transition: opacity 0.16s ease, transform 0.16s ease;
            z-index: 12;

            top: -6px;

        .radial-tooltip span {

        .radial-topic-node.unlocked:not(.done) .radial-node-dot {

        }

        [data-theme="dark"] .character-stage {
            background:
                radial-gradient(circle at 50% 16%, rgba(45, 212, 191, 0.18), transparent 34%),
                linear-gradient(180deg, rgba(15, 118, 110, 0.22), rgba(15, 23, 42, 0.28));
        }

        .character-svg {
            width: min(100%, 360px);
            height: auto;
            filter: drop-shadow(0 18px 24px rgba(15, 23, 42, 0.16));
        }

        .character-summary {
            display: grid;
            gap: 4px;
            margin-top: 16px;
        }

        .character-summary strong {
            font-size: 1.45rem;
            color: var(--shell-text);
        }

        .character-summary span,
        .character-summary small {
            color: var(--shell-muted);
            font-weight: 800;
        }

        .character-control-panel {
            display: grid;
            gap: 16px;
            padding: 18px;
        }

        .designer-block {
            padding: 16px;
        }

        .designer-block-head {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .designer-block-head h2,
        .wardrobe-section h3 {
            margin: 0;
        }

        .designer-block-head span,
        .wardrobe-section h3 {
            color: var(--shell-muted);
            font-weight: 900;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .split-block {
            display: grid;
            grid-template-columns: minmax(220px, 0.8fr) 1.2fr;
            gap: 16px;
        }

        .choice-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(178px, 1fr));
            gap: 12px;
        }

        .group-choice,
        .pill-choice,
        .model-choice,
        .item-action {
            border: 1px solid var(--shell-border);
            background: rgba(255, 255, 255, 0.72);
            color: var(--shell-text);
            cursor: pointer;
            font-weight: 900;
        }

        [data-theme="dark"] .group-choice,
        [data-theme="dark"] .pill-choice,
        [data-theme="dark"] .model-choice,
        [data-theme="dark"] .item-action {
            background: rgba(15, 23, 42, 0.76);
        }

        .group-choice {
            display: grid;
            grid-template-columns: 54px 1fr;
            gap: 10px;
            min-height: 82px;
            align-items: center;
            border-radius: 14px;
            padding: 10px;
            text-align: left;
        }

        .group-choice.active,
        .pill-choice.active,
        .model-choice.active,
        .item-card.equipped {
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.18);
        }

        [data-theme="dark"] .group-choice.active,
        [data-theme="dark"] .pill-choice.active,
        [data-theme="dark"] .model-choice.active,
        [data-theme="dark"] .item-card.equipped {
            border-color: #5eead4;
            box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.18);
        }

        .group-mini,
        .model-choice {
            display: grid;
            place-items: center;
        }

        .group-mini svg,
        .model-choice svg {
            width: 52px;
            height: 52px;
        }

        .group-choice strong,
        .group-choice small {
            display: block;
        }

        .group-choice small {
            margin-top: 3px;
            color: var(--shell-muted);
            font-size: 0.75rem;
            font-weight: 800;
        }

        .choice-row,
        .model-row,
        .shop-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
        }

        .pill-choice {
            border-radius: 999px;
            padding: 9px 13px;
        }

        .model-choice {
            width: 62px;
            height: 62px;
            border-radius: 16px;
            padding: 4px;
        }

        .wardrobe-section {
            display: grid;
            gap: 9px;
            margin-top: 14px;
        }

        .item-row,
        .shop-grid {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
        }

        .shop-grid {
            margin-top: 12px;
            max-height: 520px;
            overflow: auto;
            padding-right: 4px;
            scrollbar-width: thin;
        }

        .item-card {
            border: 1px solid color-mix(in srgb, var(--item-color, #0f766e), white 50%);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.74);
            color: var(--shell-text);
            display: grid;
            gap: 6px;
            min-height: 160px;
            padding: 12px;
            position: relative;
        }

        [data-theme="dark"] .item-card {
            background: rgba(15, 23, 42, 0.76);
            border-color: color-mix(in srgb, var(--item-color, #0f766e), #0f172a 46%);
        }

        .item-card.locked {
            opacity: 0.56;
            filter: grayscale(0.25);
        }

        .item-card strong,
        .item-card small,
        .item-card span {
            display: block;
        }

        .item-card small,
        .item-card span {
            color: var(--shell-muted);
            font-size: 0.77rem;
            font-weight: 800;
        }

        .item-token {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            background: color-mix(in srgb, var(--item-color, #0f766e), white 78%);
            color: color-mix(in srgb, var(--item-color, #0f766e), #0f172a 20%);
            font-weight: 900;
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--item-color, #0f766e), white 42%);
        }

        .item-action {
            align-self: end;
            border-radius: 999px;
            padding: 8px 10px;
        }

        .item-action:disabled {
            cursor: not-allowed;
            opacity: 0.62;
        }

        #frame-shell {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 12px;
        }

        .frame-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .frame-toolbar-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 1px solid var(--shell-border);
            border-radius: 12px;
            background: white;
            box-shadow: var(--shell-shadow);
        }

        [data-theme="dark"] iframe {
            background: #0f172a;
            border-color: #1f4f46;
        }

        [hidden] { display: none !important; }

        @media (max-width: 860px) {
            body { overflow: auto; }
            .topbar { align-items: flex-start; flex-direction: column; }
            .shell-actions { justify-content: flex-start; }
            #main-view, #frame-shell { height: auto; min-height: calc(100vh - 160px); }
            iframe { min-height: 76vh; }
            .learning-tree { padding-left: 38px; }
            .learning-tree::before { left: 13px; }
            .tree-grade::before {
                left: -25px;
                width: 25px;
            }
            .tree-grade::after { left: -35px; }
            .strand-branch {
                grid-template-columns: 1fr;
            }
            .strand-branch::before {
                left: 18px;
                right: auto;
                top: 38px;
                bottom: 0;
                width: 2px;
                height: auto;
            }
            .strand-label {
                justify-self: start;
            }
            .character-layout,
            .split-block {
                grid-template-columns: 1fr;
            }
            .character-preview-panel {
                position: static;
            }
            .character-stage {
                min-height: 360px;
            }
        }

        @media (max-width: 680px) {
            .subject-grid {
                display: grid;
                gap: 12px;
                grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
                min-height: 0;
            }

            .subject-pill {
                position: relative;
                left: auto !important;
                top: auto !important;
                justify-self: center;
                width: 72px;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="brand">
                <button type="button" class="brand-mark" onclick="navigate('character')" aria-label="Charakterdesigner oeffnen" title="Charakterdesigner oeffnen">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <!-- Graduation Cap -->
                        <path d="M12 2 L22 6 L12 10 L2 6 Z" />
                        <path d="M6 7.6 V10 C6 13 18 13 18 10 V7.6" />
                        <path d="M12 6 C18 6 21 8 21 12" />
                        <!-- Troll Face Outline -->
                        <path d="M6 11 V17 C6 22 18 22 18 17 V11" />
                        <!-- Pointy Ears -->
                        <path d="M6 12 L1 13 L6 15" />
                        <path d="M18 12 L23 13 L18 15" />
                        <!-- Angry Eyebrows & Eyes -->
                        <path d="M8 13 L10 14 M16 13 L14 14" />
                        <!-- Big Nose -->
                        <path d="M11 15 C10 15 10 17 12 17 C14 17 14 15 13 15" />
                        <!-- Tusks & Mouth -->
                        <path d="M9 17 L9 19 M15 17 L15 19" />
                        <path d="M8 19 Q12 20 16 19" />
                    </svg>
                </button>
                <div>
                    <strong id="app-title">SciVerse</strong>
                    <small>Mittelschule Wien</small>
                </div>
            </div>

            <nav class="top-nav" aria-label="Hauptnavigation">
                <button type="button" data-view="home" onclick="navigate('home')">Startseite</button>
                <button type="button" data-view="challenge" onclick="navigate('challenge')">Herausforderung</button>
            </nav>

            <div class="shell-actions">
                <span class="coin-chip"><span data-coin-count>0</span> Plus-M&uuml;nzen</span>
                <div class="language-menu" id="language-menu">
                    <button type="button" class="shell-action language-toggle" id="language-toggle" onclick="toggleLanguageMenu()" aria-label="Sprache waehlen" aria-haspopup="true" aria-expanded="false">
                        <span class="language-glyph" aria-hidden="true">A/&#25991;</span>
                    </button>
                    <div class="lang-row language-dropdown" id="language-dropdown" aria-label="Sprache waehlen" hidden>
                        <button type="button" class="lang-btn" data-lang="de" onclick="setLanguage('de')">DE</button>
                        <button type="button" class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
                        <button type="button" class="lang-btn" data-lang="ar" onclick="setLanguage('ar')">AR</button>
                        <button type="button" class="lang-btn" data-lang="uk" onclick="setLanguage('uk')">UK</button>
                        <button type="button" class="lang-btn" data-lang="sr" onclick="setLanguage('sr')">SR</button>
                        <button type="button" class="lang-btn" data-lang="tr" onclick="setLanguage('tr')">TR</button>
                    </div>
                </div>
                <button type="button" class="shell-action theme-toggle" id="dark-mode-toggle" onclick="toggleDarkMode()" aria-label="Waldmodus aktivieren" title="Waldmodus aktivieren"><span class="theme-glyph" aria-hidden="true">&#127794;</span></button>
                <button type="button" class="shell-action" onclick="resetAllProgress()">Reset</button>
            </div>
        </header>

        <main class="workspace">
            <div id="main-view"></div>
            <div id="frame-shell" hidden>
                <div class="frame-toolbar">
                    <button type="button" class="quiet-action" onclick="backToShell()">Zur&uuml;ck</button>
                    <div class="frame-toolbar-group">
                        <button type="button" class="quiet-action" id="frame-practice-reset" onclick="resetCurrentTopicPractice()" hidden>&Uuml;bungsfragen zur&uuml;cksetzen</button>
                    </div>
                </div>
                <iframe id="game-frame" name="game-frame" title="Kapitel"></iframe>
            </div>
        </main>
    </div>

    <script src="js/curriculum.js?v=1.0"></script>
    <script src="js/character_designer.js?v=1.0"></script>
    <script src="js/app_shell.js?v=3.2"></script>
</body>
</html>
