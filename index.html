<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SciVerse - Lernseite für die Mittelschule</title>
    <link rel="stylesheet" href="css/style.css?v=5.8">
    <style>
        :root {
            --sidebar-bg: #0f172a;
            --main-bg: #1e293b;
            --text-color: white;
            --nav-btn-color: #cbd5e0;
            --nav-btn-active-bg: #1e293b;
            --nav-btn-active-border: #3b82f6;
            --nav-btn-active-text: #60a5fa;
            --header-gradient: linear-gradient(135deg, #3b82f6, #2563eb);
            --header-border: #1e40af;
        }

        [data-theme="dark"] {
            --sidebar-bg: #000000;
            --main-bg: #0a0a0a;
            --text-color: #e5e7eb;
            --nav-btn-color: #a0aec0;
            --nav-btn-active-bg: #121212;
            --nav-btn-active-border: #2196F3;
            --nav-btn-active-text: #64b5f6;
            --header-gradient: linear-gradient(135deg, #1e3a8a, #1e40af);
            --header-border: #172554;
        }

        * {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        *::-webkit-scrollbar {
            width: 0;
            height: 0;
            display: none;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background-color: var(--main-bg); color: var(--text-color); overflow: hidden; transition: background-color 0.3s, color 0.3s; }
        #sidebar { width: 320px; background-color: var(--sidebar-bg); overflow-y: auto; display: flex; flex-direction: column; transition: margin-left 0.3s, background-color 0.3s; box-shadow: 4px 0 15px rgba(0,0,0,0.3); z-index: 10; }
        #sidebar.collapsed { margin-left: -320px; }
        .sidebar-header { padding: 60px 20px 20px 20px; text-align: center; background: var(--header-gradient); border-bottom: 2px solid var(--header-border); }
        .sidebar-header h1 { margin: 10px 0; font-size: 1.4em; text-shadow: 0 2px 4px rgba(0,0,0,0.3); color: white; }
        .sciverse-logo-link { align-items: center; border-radius: 18px; display: inline-flex; height: 86px; justify-content: center; margin: 4px auto 12px; text-decoration: none; transition: none; width: 86px; }
        .sciverse-logo-link:focus-visible { outline: 3px solid #fbbf24; outline-offset: 6px; }
        .sciverse-logo { width: 86px; height: 86px; filter: drop-shadow(0 10px 20px rgba(15, 23, 42, 0.38)); transition: none; }
        .sciverse-title { margin: 0; font-size: 1.7em; letter-spacing: 0.04em; color: white; }
        .sciverse-subtitle { margin: 0; color: #dbeafe; font-size: 0.78em; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
        .grade-section { padding: 15px 20px 5px 20px; font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; border-bottom: 1px solid #334155; margin-top: 10px; font-weight: bold; }
        .nav-btn { background: transparent; color: var(--nav-btn-color); border: none; width: 100%; text-align: left; padding: 12px 20px; cursor: pointer; border-left: 4px solid transparent; transition: all 0.2s; font-size: 0.95em; }
        .nav-btn:hover, .nav-btn.active { background-color: var(--nav-btn-active-bg); color: var(--text-color); border-left: 4px solid var(--nav-btn-active-border); }
        .nav-btn.active { color: var(--nav-btn-active-text); font-weight: bold; }
        .nav-btn.planned-topic { color: #94a3b8; opacity: 0.82; font-style: italic; }
        .nav-btn.planned-topic:hover { opacity: 1; }
        #content-area { flex-grow: 1; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background-color: white; }
        #zeugnis-btn { position: fixed; top: 8px; right: 20px; z-index: 1000; background: linear-gradient(135deg, #FFD700, #FF9800); padding: 10px 20px; border-radius: 50px; cursor: pointer; font-weight: bold; border: 2px solid white; color: #1e293b; box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4); display: flex; align-items: center; gap: 8px; transition: transform 0.2s; }
        #zeugnis-btn:hover { transform: scale(1.05); }
        #menu-toggle { position: fixed; top: 15px; left: 15px; z-index: 100; background: #3b82f6; color: white; border: none; padding: 10px 12px; border-radius: 5px; cursor: pointer; }
        .language-menu { display: flex; justify-content: center; padding: 5px 0 15px 0; position: relative; }
        .language-toggle { align-items: center; background: rgba(15, 23, 42, 0.74); border: 1px solid rgba(219, 234, 254, 0.35); border-radius: 999px; color: white; cursor: pointer; display: flex; font-size: 0.92em; font-weight: 800; gap: 7px; padding: 8px 12px; }
        .language-toggle:hover, .language-toggle[aria-expanded="true"] { background: rgba(59, 130, 246, 0.35); border-color: #bfdbfe; }
        .language-panel { background: rgba(15, 23, 42, 0.98); border: 1px solid rgba(219, 234, 254, 0.26); border-radius: 14px; box-shadow: 0 18px 34px rgba(0,0,0,0.32); display: none; gap: 6px; grid-template-columns: repeat(2, minmax(0, 1fr)); left: 50%; min-width: 190px; padding: 8px; position: absolute; top: 48px; transform: translateX(-50%); z-index: 30; }
        .language-panel.open { display: grid; }
        .lang-btn { background: #334155; color: white; border: 1px solid #475569; padding: 8px 10px; border-radius: 10px; cursor: pointer; font-size: 0.82em; font-weight: 800; text-align: left; }
        .lang-btn.active { background: #3b82f6; border-color: #93c5fd; }

        @media (max-width: 760px) {
            body { display: block; }
            #sidebar {
                height: 100vh;
                left: 0;
                margin-left: 0;
                max-width: 320px;
                position: fixed;
                top: 0;
                transform: translateX(0);
                transition: transform 0.3s, background-color 0.3s;
                width: min(86vw, 320px);
                z-index: 900;
            }
            #sidebar.collapsed {
                margin-left: 0;
                transform: translateX(-105%);
            }
            #content-area {
                height: 100vh;
                width: 100vw;
            }
            #menu-toggle {
                z-index: 1100;
            }
            #zeugnis-btn {
                right: 10px;
                top: 10px;
                max-width: calc(100vw - 72px);
            }
        }
    </style>
</head>

        </div>
        
                <div style="padding: 10px 20px;">

                <button id="sort-topic-btn" onclick="setSortMode('topic')" style="flex: 1; padding: 6px; border-radius: 4px; border: none; background: var(--nav-btn-active-bg); color: var(--nav-btn-color); cursor: pointer; font-size: 0.85em;">Nach Thema</button>

        <button class="nav-btn" data-page="topics/start.html" onclick="loadPage('topics/start.html', this)" style="font-weight: bold; color: var(--nav-btn-active-text);">🏠 Startseite</button>

    <script src="js/learning_radio.js?v=1.4"></script>
    <script>
        const TOPIC_TEMPLATE_VERSION = '13.1';

        // Message handling for communication from iframe
        window.addEventListener('message', (e) => {
            if (e.data.type === 'updateScore') {
                document.getElementById('global-score-val').innerText = e.data.score;
            }
            if (e.data.type === 'navigate') {
                loadPage(e.data.page, null);
            }
            if (e.data.type === 'selectSubject' && isKnownSubject(e.data.subject)) {
                setSelectedSubject(e.data.subject);
                renderNav();
                const sidebar = document.getElementById('sidebar');
                const toggle = document.getElementById('menu-toggle');
                if (sidebar.classList.contains('collapsed')) {
                    sidebar.classList.remove('collapsed');
                    toggle.setAttribute('aria-expanded', 'true');
                }
                sidebar.scrollTo({ top: document.getElementById('dynamic-nav-container').offsetTop - 12, behavior: 'smooth' });
            }
        });

        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.getElementById('menu-toggle');
            sidebar.classList.toggle('collapsed');
            const isCollapsed = sidebar.classList.contains('collapsed');
            toggle.setAttribute('aria-expanded', !isCollapsed);
        }

        function toggleLanguageMenu(forceOpen = null) {
            const panel = document.getElementById('language-panel');
            const toggle = document.getElementById('language-toggle');
            if (!panel || !toggle) return;
            const isOpen = forceOpen === null ? !panel.classList.contains('open') : Boolean(forceOpen);
            panel.classList.toggle('open', isOpen);
            toggle.setAttribute('aria-expanded', String(isOpen));
        }

        document.addEventListener('click', (event) => {
            const menu = document.querySelector('.language-menu');
            if (menu && !menu.contains(event.target)) toggleLanguageMenu(false);
        });

        const shellTranslations = {
            de: {
                menuToggle: 'Menü umschalten',
                report: 'Mein Zeugnis',
                chooseLanguage: 'Sprache wählen',
                openSpace: 'SciVerse Space Program öffnen',
                subtitle: 'Mittelschule Wien',
                points: 'Punkte',
                nightMode: 'Nachtmodus 🌙',
                dayMode: 'Tagmodus ☀️',
                reset: 'Reset 🔄',
                sortGrade: 'Nach Schuljahr',
                sortTopic: 'Nach Thema',
                start: 'Startseite',
                glossary: 'Glossar',
                planned: 'geplant',
                emptySubject: 'Inhalte für dieses Fach folgen in Kürze! 🚧',
                currentTopic: 'Aktuelles Thema: ',
                resetConfirm: 'Möchtest du wirklich deinen gesamten Fortschritt, alle Punkte und gelösten Aufgaben löschen?'
            },
            en: {
                menuToggle: 'Toggle menu',
                report: 'My report',
                chooseLanguage: 'Choose language',
                openSpace: 'Open SciVerse Space Program',
                subtitle: 'Middle School Vienna',
                points: 'points',
                nightMode: 'Night mode 🌙',
                dayMode: 'Day mode ☀️',
                reset: 'Reset 🔄',
                sortGrade: 'By school year',
                sortTopic: 'By topic',
                start: 'Start page',
                glossary: 'Glossary',
                planned: 'planned',
                emptySubject: 'Content for this subject is coming soon! 🚧',
                currentTopic: 'Current topic: ',
                resetConfirm: 'Do you really want to delete all progress, points and solved tasks?'
            }
        };

        function shellText(key) {
            const lang = localStorage.getItem('physik_lang') || 'de';
            const dict = shellTranslations[lang] || shellTranslations.en;
            return dict[key] || shellTranslations.de[key] || key;
        }

        function applyShellLanguage() {
            const menuToggle = document.getElementById('menu-toggle');
            if (menuToggle) menuToggle.setAttribute('aria-label', shellText('menuToggle'));

            const reportButton = document.getElementById('zeugnis-btn');
            if (reportButton) reportButton.textContent = `🎓 ${shellText('report')}`;

            const languageToggle = document.getElementById('language-toggle');
            if (languageToggle) languageToggle.setAttribute('title', shellText('chooseLanguage'));
            const languagePanel = document.getElementById('language-panel');
            if (languagePanel) languagePanel.setAttribute('aria-label', shellText('chooseLanguage'));

            const brand = document.querySelector('.sciverse-logo-link');
            if (brand) brand.setAttribute('aria-label', shellText('openSpace'));
            const subtitle = document.querySelector('.sciverse-subtitle');
            if (subtitle) subtitle.textContent = shellText('subtitle');

            const score = document.getElementById('global-score-val')?.textContent || '0';
            const scoreLabel = document.getElementById('global-score-label');
            if (scoreLabel) scoreLabel.innerHTML = `🏆 <span id="global-score-val">${score}</span> ${shellText('points')}`;

            const resetButton = document.getElementById('reset-progress-btn');
            if (resetButton) resetButton.textContent = shellText('reset');
            const gradeButton = document.getElementById('sort-grade-btn');
            if (gradeButton) gradeButton.textContent = shellText('sortGrade');
            const topicButton = document.getElementById('sort-topic-btn');
            if (topicButton) topicButton.textContent = shellText('sortTopic');

            const startButton = document.querySelector('[data-page="topics/start.html"]');
            if (startButton) startButton.textContent = `🏠 ${shellText('start')}`;
            const glossaryButton = document.querySelector('[data-page="topics/glossar.html"]');
            if (glossaryButton) glossaryButton.textContent = `📖 ${shellText('glossary')}`;

            applyTheme(localStorage.getItem('physik_dark_mode') === 'true');
            if (typeof window.SciverseLearningRadioApplyLanguage === 'function') {
                window.SciverseLearningRadioApplyLanguage();
            }
        }

        function setLanguage(l) {
            localStorage.setItem('physik_lang', l);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('lang-' + l);
            if (btn) btn.classList.add('active');
            const label = document.getElementById('current-lang-label');
            if (label) label.textContent = l.toUpperCase();
            document.documentElement.lang = l;
            applyShellLanguage();
            renderNav();
            toggleLanguageMenu(false);
            
            // Reload current iframe if it's already loading something
            const frame = document.getElementById('game-frame');
            if (frame.src && frame.src !== 'about:blank') {
                try {
                    frame.contentWindow.postMessage({ type: 'languageChange', lang: l }, '*');
                } catch (error) {}
                frame.contentWindow.location.reload();
            }
        }

        
        const curriculum = {

                    { id: "arbeit", title: "🏗 8. Mechanische Arbeit", grade: "7. Schulstufe (3. Kl.)", category: "Mechanik" },
                    { id: "energie", title: "🔋 9. Energieformen", grade: "7. Schulstufe (3. Kl.)", category: "Mechanik" },
                    { id: "akustik", title: "🎶 10. Akustik", grade: "7. Schulstufe (3. Kl.)", category: "Akustik" },
                    { id: "elektromagnetismus", title: "🧲 11. Elektromagnetismus", grade: "8. Schulstufe (4. Kl.)", category: "Elektrizitätslehre" },

                    { id: "wetter", title: "🌤️ Wetter", grade: "7. Schulstufe (3. Kl.)", category: "Klima & Umwelt" },
                    { id: "klima", title: "🌡️ Klima", grade: "7. Schulstufe (3. Kl.)", category: "Klima & Umwelt" },
                    { id: "klimawandel", title: "🆘 Klimawandel", grade: "7. Schulstufe (3. Kl.)", category: "Klima & Umwelt" }
                ]
            },
            dgb: {
                topics: [
                    { id: "dgb_word_werkstatt", title: "📝 Word-Werkstatt", grade: "5./6. Schulstufe", category: "Praxis" },
                    { id: "dgb5_orientierung", title: "🧭 Orientierung", grade: "5. Schulstufe (1. Kl.)", category: "5. Schulstufe" },
                    { id: "dgb5_information", title: "🔎 Information", grade: "5. Schulstufe (1. Kl.)", category: "5. Schulstufe" },
                    { id: "dgb5_kommunikation", title: "💬 Kommunikation", grade: "5. Schulstufe (1. Kl.)", category: "5. Schulstufe" },
                    { id: "dgb5_produktion", title: "🛠️ Produktion", grade: "5. Schulstufe (1. Kl.)", category: "5. Schulstufe" },
                    { id: "dgb5_handeln", title: "🧰 Handeln", grade: "5. Schulstufe (1. Kl.)", category: "5. Schulstufe" },

                    { id: "math3_6_zuordnungen", title: "📉 6. Zuordnungen (Funktionen)", grade: "3. Klasse (7. Schulstufe)", category: "Algebra" },
                    { id: "math3_7_aehnlichkeit", title: "🔍 7. Ähnlichkeit", grade: "3. Klasse (7. Schulstufe)", category: "Geometrie" },
                    { id: "math3_8_pythagoras", title: "📐 8. Der Satz des Pythagoras", grade: "3. Klasse (7. Schulstufe)", category: "Geometrie" },
                    { id: "math3_9_koerper", title: "🧊 9. Geometrische Körper", grade: "3. Klasse (7. Schulstufe)", category: "Geometrie" },
                    { id: "math3_10_prozent_zins", title: "💰 10. Prozent- und Zinsrechnung", grade: "3. Klasse (7. Schulstufe)", category: "Arithmetik" },
                    { id: "math3_11_statistik", title: "📊 11. Statistik", grade: "3. Klasse (7. Schulstufe)", category: "Statistik" },
                    
                    // 8. Schulstufe (4. Klasse) - Genial! Mathematik 4
                    { id: "math4_1_reelle_zahlen", title: "🔢 1. Reelle Zahlen (Wurzeln)", grade: "4. Klasse (8. Schulstufe)", category: "Arithmetik" },
                    { id: "math4_2_pythagoras", title: "📐 2. Satz des Pythagoras", grade: "4. Klasse (8. Schulstufe)", category: "Geometrie" },
                    { id: "math4_3_terme_gleichungen", title: "🧮 3. Terme und Gleichungen", grade: "4. Klasse (8. Schulstufe)", category: "Algebra" },
                    { id: "math4_4_funktionen_sys", title: "✖️ 4. Lineare Funktionen & Gleichungssysteme", grade: "4. Klasse (8. Schulstufe)", category: "Algebra" },
                    { id: "math4_5_aehnlichkeit", title: "🔍 5. Ähnlichkeit und Strahlensätze", grade: "4. Klasse (8. Schulstufe)", category: "Geometrie" },
                    { id: "math4_6_koerper", title: "🔮 6. Geometrische Körper (Zylinder, Kegel, Kugel)", grade: "4. Klasse (8. Schulstufe)", category: "Geometrie" },
                    { id: "math4_7_statistik", title: "📊 7. Statistik", grade: "4. Klasse (8. Schulstufe)", category: "Statistik" },
                    { id: "math4_8_finanzmathematik", title: "📈 8. Finanzmathematik", grade: "4. Klasse (8. Schulstufe)", category: "Arithmetik" },
                    { id: "mathespiel", title: "🎮 Extra: Rechenreise", grade: "Extra", category: "Lernspiel" },
                    { id: "math_kaenguru", title: "🦘 Extra: Känguru der Mathematik", grade: "Extra", category: "Wettbewerb" }
                ]
            }
        };

        window.SCIVERSE_CURRICULUM = curriculum;

        let currentSortMode = 'grade';
        const selectedSubjectKey = 'physik_selected_subject';

        function isKnownSubject(subject) {
            return Boolean(subject && curriculum[subject]);
        }

        function normalizeTopicPage(page) {
            if (!page) return '';
            let normalized = page;
            try {
                normalized = decodeURIComponent(normalized);
            } catch (error) {
                // Keep original value when it is not URI encoded.
            }

            if (normalized.includes('?')) {
                const query = normalized.split('?')[1].split('#')[0];
                const topic = new URLSearchParams(query).get('topic');
                if (topic) return topic;
            }

            if (!normalized.includes('/') && !normalized.includes('.html')) return normalized;
            if (normalized.startsWith('topics/') && !['dashboard', 'glossar', 'template', 'start'].some(x => normalized.includes(x))) {
                return normalized.replace('topics/', '').replace('.html', '').replace(/[\s,]+/g, '_');
            }
            return normalized;
        }

        function findSubjectForPage(page) {
            const topicId = normalizeTopicPage(page);
            for (const [subject, data] of Object.entries(curriculum)) {
                if (data.topics.some(item => item.id === topicId)) return subject;
            }
            return null;
        }

        function findTopicById(topicId) {
            for (const [subject, data] of Object.entries(curriculum)) {
                const topic = data.topics.find(item => item.id === topicId);
                if (topic) return { subject, topic };
            }
            return null;
        }

        function getSubjectLabel(subject) {
            const option = document.querySelector(`#subject-select option[value="${subject}"]`);
            return option ? option.textContent.replace(/^\S+\s*/, '').trim() : subject;
        }

        function setSelectedSubject(subject, shouldSave = true) {
            if (!isKnownSubject(subject)) return;
            const select = document.getElementById('subject-select');
            if (!select) return;
            select.value = subject;
            if (shouldSave) localStorage.setItem(selectedSubjectKey, subject);
        }

        function restoreSelectedSubject(page) {
            const hashSubject = findSubjectForPage(window.location.hash.substring(1));
            const savedSubject = localStorage.getItem(selectedSubjectKey);
            const pageSubject = findSubjectForPage(page);
            const subject = hashSubject || (isKnownSubject(savedSubject) ? savedSubject : null) || pageSubject || 'physik';
            setSelectedSubject(subject);
        }

        function handleSubjectChange() {
            const subject = document.getElementById('subject-select').value;
            setSelectedSubject(subject);
            renderNav();
        }

        function setSortMode(mode) {
            currentSortMode = mode;
            document.getElementById('sort-grade-btn').style.background = mode === 'grade' ? 'var(--nav-btn-active-border)' : 'var(--nav-btn-active-bg)';
            document.getElementById('sort-grade-btn').style.color = mode === 'grade' ? 'white' : 'var(--nav-btn-color)';
            document.getElementById('sort-topic-btn').style.background = mode === 'topic' ? 'var(--nav-btn-active-border)' : 'var(--nav-btn-active-bg)';
            document.getElementById('sort-topic-btn').style.color = mode === 'topic' ? 'white' : 'var(--nav-btn-color)';
            renderNav();
        }

        function renderNav() {
            const subject = document.getElementById('subject-select').value;
            const container = document.getElementById('dynamic-nav-container');
            container.innerHTML = '';
            
            const items = curriculum[subject].topics;
            
            if (items.length === 0) {
                container.innerHTML = `<div style="padding: 20px; color: #94a3b8; text-align: center; font-style: italic; font-size: 0.9em;">${shellText('emptySubject')}</div>`;
                return;
            }

            const groups = {};
            items.forEach(item => {
                const key = currentSortMode === 'grade' ? item.grade : item.category;
                if (!groups[key]) groups[key] = [];
                groups[key].push(item);
            });

            for (const [groupName, groupItems] of Object.entries(groups)) {
                const header = document.createElement('div');
                header.className = 'grade-section';
                header.innerText = currentSortMode === 'grade' ? '📚 ' + groupName : '📂 ' + groupName;
                container.appendChild(header);

                groupItems.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = 'nav-btn';
                    if (item.available === false) btn.classList.add('planned-topic');
                    btn.setAttribute('data-page', item.id);
                    btn.onclick = function() { loadPage(item.id, this); };
                    btn.innerText = item.available === false ? item.title + ' · ' + shellText('planned') : item.title;
                    container.appendChild(btn);
                });
            }

            const currentPage = localStorage.getItem('physik_current_page');
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.getAttribute('data-page') === currentPage) {
                    btn.classList.add('active');
                }
            });
        }

        function loadPage(page, button, fromHash = false) {
            localStorage.setItem('physik_current_page', page);
            const pageSubject = findSubjectForPage(page);
            const subjectSelect = document.getElementById('subject-select');
            if (pageSubject && subjectSelect && subjectSelect.value !== pageSubject) {
                setSelectedSubject(pageSubject);
                renderNav();
            }
            let url = page;

            // Update URL hash for bookmarking (unless triggered by hashchange already)
            if (!fromHash) {
                window.location.hash = page;
            }

            // Mapping for simple topic IDs to template URL
            if (!page.includes('/') && !page.includes('.html')) {
                const planned = findTopicById(page);
                if (planned && planned.topic.available === false) {
                    const params = new URLSearchParams({
                        title: planned.topic.title.replace(/\s*·\s*geplant$/, ''),
                        subject: getSubjectLabel(planned.subject),
                        grade: planned.topic.grade,
                        strand: planned.topic.category
                    });
                    url = `topics/placeholder.html?${params.toString()}`;
                } else {
                    url = `topics/template.html?topic=${encodeURIComponent(page)}&v=${TOPIC_TEMPLATE_VERSION}`;
                }
            } else if (page.startsWith('topics/') && !['dashboard', 'glossar', 'template', 'start', 'space_program'].some(x => page.includes(x))) {
                const topicId = page.replace('topics/', '').replace('.html', '').replace(/[\s,]+/g, '_');
                url = `topics/template.html?topic=${encodeURIComponent(topicId)}&v=${TOPIC_TEMPLATE_VERSION}`;
            } else if (page === 'topics/dashboard.html') {
                url = 'topics/dashboard.html?v=3';
            } else if (page === 'topics/glossar.html') {
                url = 'topics/glossar.html?v=4';
            } else if (page === 'topics/start.html') {
                url = 'topics/start.html?v=10';
            } else if (page === 'topics/space_program.html') {
                url = 'topics/space_program.html?v=1';
            }

            const frame = document.getElementById('game-frame');
            if (frame.src !== window.location.origin + '/' + url && !frame.src.endsWith(url)) {
                frame.src = url;
            } else {
                syncFrameTheme(localStorage.getItem('physik_dark_mode') === 'true');
            }

            // Highlight active button
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if (button) {
                button.classList.add('active');
                frame.title = shellText('currentTopic') + button.innerText.trim();
            } else {
                // Find button by page name if navigated via code or hash
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    const pageAttr = btn.getAttribute('data-page');
                    if (pageAttr === page) {
                        btn.classList.add('active');
                        frame.title = shellText('currentTopic') + btn.innerText.trim();
                    }
                });
            }
        }

        function toggleDarkMode() {
            let isDark = localStorage.getItem('physik_dark_mode') === 'true';
            isDark = !isDark;
            localStorage.setItem('physik_dark_mode', isDark);
            applyTheme(isDark);
        }

        function applyTheme(isDark) {
            const btn = document.getElementById('dark-mode-toggle');
            if (isDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
                if (btn) btn.textContent = shellText('dayMode');
            } else {
                document.documentElement.removeAttribute('data-theme');
                if (btn) btn.textContent = shellText('nightMode');
            }
            
            syncFrameTheme(isDark);
        }

        function syncFrameTheme(isDark) {
            const frame = document.getElementById('game-frame');
            if (!frame) return;
            try {
                if (frame.contentDocument) {
                    if (isDark) {
                        frame.contentDocument.documentElement.setAttribute('data-theme', 'dark');
                    } else {
                        frame.contentDocument.documentElement.removeAttribute('data-theme');
                    }
                }
            } catch (error) {
                // Keep the postMessage fallback for hosted browsers that restrict iframe access.
            }
            if (frame.contentWindow) {
                frame.contentWindow.postMessage({ type: 'themeChange', isDark: isDark }, '*');
            }
        }

        function resetProgress() {
            if (confirm(shellText('resetConfirm'))) {
                localStorage.clear();
                location.reload();
            }
        }

        // Handle browser back/forward buttons
        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.substring(1);
            if (hash) {
                loadPage(hash, null, true);
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            // Restore Score
            document.getElementById('global-score-val').innerText = localStorage.getItem('physik_score') || 0;
            
            // Restore Language
            const lang = localStorage.getItem('physik_lang') || 'de';
            setLanguage(lang);
            
            // Restore Theme
            const isDark = localStorage.getItem('physik_dark_mode') === 'true';
            applyTheme(isDark);
            document.getElementById('game-frame').addEventListener('load', () => {
                syncFrameTheme(localStorage.getItem('physik_dark_mode') === 'true');
            });
            
            // Restore Page (Prefer Hash -> LocalStorage -> Default)
            const hashPage = window.location.hash.substring(1);
            const savedPage = hashPage || localStorage.getItem('physik_current_page') || 'topics/start.html';
            restoreSelectedSubject(savedPage);
            renderNav();
            loadPage(savedPage, null);
        });
    </script>
</body>
