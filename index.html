<head>

    <link rel="stylesheet" href="css/style.css?v=5.6">
    <style>
        :root {
            --sidebar-bg: #0f172a;
            --main-bg: #eaf2fb;
            --text-color: white;
            --nav-btn-color: #cbd5e0;
            --nav-btn-active-bg: #172554;
            --nav-btn-active-border: #14b8a6;
            --nav-btn-active-text: #ffffff;
            --sidebar-muted: #94a3b8;
            --sidebar-panel: #111c31;
            --header-gradient: linear-gradient(180deg, #123c69, #0f766e);
            --header-border: #1e40af;
        }

        [data-theme="dark"] {
            --sidebar-bg: #000000;
            --main-bg: #050816;
            --text-color: #e5e7eb;
            --nav-btn-color: #a0aec0;
            --nav-btn-active-bg: #172033;
            --nav-btn-active-border: #2dd4bf;
            --nav-btn-active-text: #f8fafc;
            --sidebar-muted: #94a3b8;
            --sidebar-panel: #111827;
            --header-gradient: linear-gradient(180deg, #0f172a, #134e4a);
            --header-border: #172554;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background-color: var(--main-bg); color: var(--text-color); overflow: hidden; transition: background-color 0.3s, color 0.3s; }
        #sidebar { width: 336px; background-color: var(--sidebar-bg); overflow-y: auto; display: flex; flex-direction: column; transition: margin-left 0.3s, background-color 0.3s; box-shadow: 4px 0 18px rgba(15,23,42,0.28); z-index: 10; }
        #sidebar.collapsed { margin-left: -336px; }
        .sidebar-header { padding: 54px 18px 18px 18px; background: var(--header-gradient); border-bottom: 1px solid rgba(255,255,255,0.18); }
        .language-row { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; padding: 2px 0 14px 0; }
        .sidebar-title { margin: 6px 0 4px 0; font-size: 1.35em; color: white; text-align: center; line-height: 1.15; }
        .sidebar-subtitle { color: #dbeafe; font-size: 0.84em; margin: 0 0 12px 0; text-align: center; }
        .sidebar-progress { background: rgba(15, 23, 42, 0.56); padding: 12px; border-radius: 8px; border: 1px solid rgba(203,213,225,0.28); }
        .score-line { font-size: 1.08em; font-weight: 800; color: #facc15; margin-bottom: 10px; text-align: center; }
        .sidebar-actions, .sort-row { display: flex; gap: 6px; }
        .control-panel { padding: 12px 16px; border-bottom: 1px solid #1e293b; background: rgba(15, 23, 42, 0.42); }
        .subject-select, .topic-search { width: 100%; box-sizing: border-box; padding: 9px 10px; border-radius: 6px; background: var(--sidebar-panel); color: var(--text-color); border: 1px solid #334155; outline: none; margin-bottom: 8px; font-weight: 700; }
        .topic-search { font-weight: 500; color: #e2e8f0; }
        .sort-btn, .small-action-btn { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: var(--sidebar-panel); color: var(--nav-btn-color); cursor: pointer; font-size: 0.82em; font-weight: 700; }
        .sort-btn.active { background: var(--nav-btn-active-border); color: #062c2a; border-color: var(--nav-btn-active-border); }
        .small-action-btn.danger { background: #b91c1c; color: white; border-color: #ef4444; }
        .grade-section { padding: 15px 18px 7px 18px; font-size: 0.76em; text-transform: uppercase; letter-spacing: 0.06em; color: var(--sidebar-muted); border-bottom: 1px solid #243145; margin-top: 6px; font-weight: 800; }
        .nav-btn { background: transparent; color: var(--nav-btn-color); border: none; width: 100%; text-align: left; padding: 11px 18px 11px 20px; cursor: pointer; border-left: 4px solid transparent; transition: background-color 0.2s, color 0.2s, border-color 0.2s; font-size: 0.94em; line-height: 1.25; }
        .nav-btn:hover, .nav-btn.active { background-color: var(--nav-btn-active-bg); color: var(--text-color); border-left-color: var(--nav-btn-active-border); }
        .nav-btn.active { color: var(--nav-btn-active-text); font-weight: 800; }
        .nav-empty { padding: 18px; color: var(--sidebar-muted); text-align: center; font-style: italic; font-size: 0.9em; }
        #content-area { flex-grow: 1; position: relative; padding: 12px; box-sizing: border-box; }
        iframe { width: 100%; height: 100%; border: 1px solid #cbd5e1; background-color: white; border-radius: 8px; box-shadow: 0 14px 32px rgba(15,23,42,0.16); }
        #zeugnis-btn { position: fixed; top: 10px; right: 18px; z-index: 1000; background: #facc15; padding: 9px 15px; border-radius: 999px; cursor: pointer; font-weight: 800; border: 1px solid #fde68a; color: #1e293b; box-shadow: 0 8px 18px rgba(15,23,42,0.22); display: flex; align-items: center; gap: 8px; transition: transform 0.2s, box-shadow 0.2s; }
        #zeugnis-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 22px rgba(15,23,42,0.26); }
        #menu-toggle { position: fixed; top: 14px; left: 14px; z-index: 100; background: #0f766e; color: white; border: 1px solid #5eead4; padding: 9px 12px; border-radius: 6px; cursor: pointer; font-weight: 800; }
        .lang-btn { background: rgba(15,23,42,0.42); color: white; border: 1px solid rgba(203,213,225,0.35); padding: 5px 9px; border-radius: 6px; cursor: pointer; font-size: 0.78em; font-weight: 800; }
        .lang-btn.active { background: #f8fafc; border-color: white; color: #0f172a; }
        .home-links { border-bottom: 1px solid #243145; padding: 8px 0; }
        .home-links .nav-btn { font-weight: 800; }
        @media (max-width: 820px) {
            #sidebar { position: fixed; inset: 0 auto 0 0; width: min(88vw, 336px); }
            #sidebar.collapsed { margin-left: calc(-1 * min(88vw, 336px)); }
            #content-area { padding: 8px; }
            iframe { border-radius: 6px; }
            #zeugnis-btn { right: 8px; padding: 8px 11px; font-size: 0.86em; }

</head>
<body>
    <button id="menu-toggle" onclick="toggleMenu()" aria-label="Menü umschalten" aria-expanded="true">☰</button>
    <button id="zeugnis-btn" onclick="loadPage('topics/dashboard.html', null)">🎓 Mein Zeugnis</button>

        <div class="sidebar-header">

                <button onclick="setLanguage('uk')" class="lang-btn" id="lang-uk" title="Українська">UK</button>
                <button onclick="setLanguage('sr')" class="lang-btn" id="lang-sr" title="Српски">SR</button>
                <button onclick="setLanguage('tr')" class="lang-btn" id="lang-tr" title="Türkçe">TR</button>
            </div>
            <h1 class="sidebar-title">Lernabenteuer</h1>
            <p class="sidebar-subtitle">MS/AHS Unterstufe · selbstständig üben</p>
            <div class="sidebar-progress">

                <div class="sidebar-actions">

                    <button onclick="resetProgress()" class="small-action-btn danger">Reset 🔄</button>
                </div>
            </div>
        </div>
        
        <div class="control-panel">
            <select id="subject-select" class="subject-select" onchange="handleSubjectChange()" aria-label="Unterrichtsfach auswählen">
                <option value="physik">🚀 Physik</option>
                <option value="geographie">🌍 Geographie & Umwelt</option>
                <option value="dgb">💻 Digitale Grundbildung</option>
                <option value="chemie">🧪 Chemie</option>
                <option value="biologie">🧬 Biologie</option>
                <option value="mathematik">📐 Mathematik</option>
            </select>
            <input id="topic-search" class="topic-search" type="search" placeholder="Thema suchen..." aria-label="Thema suchen" oninput="renderNav()">
            <div class="sort-row">
                <button id="sort-grade-btn" class="sort-btn active" onclick="setSortMode('grade')">Schuljahr</button>
                <button id="sort-topic-btn" class="sort-btn" onclick="setSortMode('topic')">Thema</button>
            </div>
        </div>

            <button class="nav-btn" data-page="topics/glossar.html" onclick="loadPage('topics/glossar.html', this)">📖 Glossar</button>
        </div>
        
        <div id="dynamic-nav-container"></div>
    </div>
    <div id="content-area"><iframe id="game-frame" name="game-frame" title="Physik Spiel"></iframe></div>
    
    <script>
        // Message handling for communication from iframe
        window.addEventListener('message', (e) => {
            if (e.data.type === 'updateScore') {
                document.getElementById('global-score-val').innerText = e.data.score;
            }
            if (e.data.type === 'navigate') {
                loadPage(e.data.page, null);
            }
        });

        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.getElementById('menu-toggle');
            sidebar.classList.toggle('collapsed');
            const isCollapsed = sidebar.classList.contains('collapsed');
            toggle.setAttribute('aria-expanded', !isCollapsed);
        }

        function setLanguage(l) {
            localStorage.setItem('physik_lang', l);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('lang-' + l);
            if (btn) btn.classList.add('active');
            
            // Reload current iframe if it's already loading something
            const frame = document.getElementById('game-frame');
            if (frame.src && frame.src !== 'about:blank') {
                frame.contentWindow.location.reload();
            }
        }

                    { id: "math3_7_aehnlichkeit", title: "🔍 7. Ähnlichkeit", grade: "3. Klasse (7. Schulstufe)", category: "Geometrie" },
                    { id: "math3_8_pythagoras", title: "📐 8. Der Satz des Pythagoras", grade: "3. Klasse (7. Schulstufe)", category: "Geometrie" },
                    { id: "math3_9_koerper", title: "🧊 9. Geometrische Körper", grade: "3. Klasse (7. Schulstufe)", category: "Geometrie" },
                    { id: "math3_10_prozent_zins", title: "💰 10. Prozent- und Zinsrechnung", grade: "3. Klasse (7. Schulstufe)", category: "Arithmetik" },
                    { id: "math3_11_statistik", title: "📊 11. Statistik", grade: "3. Klasse (7. Schulstufe)", category: "Statistik" },
                    
                    // 8. Schulstufe (4. Klasse) - Genial! Mathematik 4
                    { id: "math4_1_reelle_zahlen", title: "🔢 1. Reelle Zahlen (Wurzeln)", grade: "4. Klasse (8. Schulstufe)", category: "Arithmetik" },
                    { id: "math4_2_pythagoras", title: "📐 2. Satz des Pythagoras", grade: "4. Klasse (8. Schulstufe)", category: "Geometrie" },
                    { id: "math4_3_terme_gleichungen", title: "🧮 3. Terme und Gleichungen", grade: "4. Klasse (8. Schulstufe)", category: "Algebra" },
                    { id: "math4_4_funktionen_sys", title: "✖️ 4. Lineare Funktionen & Gleichungssysteme", grade: "4. Klasse (8. Schulstufe)", category: "Algebra" },
                    { id: "math4_5_aehnlichkeit", title: "🔍 5. Ähnlichkeit und Strahlensätze", grade: "4. Klasse (8. Schulstufe)", category: "Geometrie" },
                    { id: "math4_6_koerper", title: "🔮 6. Geometrische Körper (Zylinder, Kegel, Kugel)", grade: "4. Klasse (8. Schulstufe)", category: "Geometrie" },
                    { id: "math4_7_statistik", title: "📊 7. Statistik", grade: "4. Klasse (8. Schulstufe)", category: "Statistik" },
                    { id: "math4_8_finanzmathematik", title: "📈 8. Finanzmathematik", grade: "4. Klasse (8. Schulstufe)", category: "Arithmetik" },
                    { id: "mathespiel", title: "🎮 Extra: Rechenreise", grade: "Extra", category: "Lernspiel" },
                    { id: "math_kaenguru", title: "🦘 Extra: Känguru der Mathematik", grade: "Extra", category: "Wettbewerb" }
                ]
            }
        };

        let currentSortMode = 'grade';
        const selectedSubjectKey = 'physik_selected_subject';

        function isKnownSubject(subject) {
            return Boolean(subject && curriculum[subject]);
        }

        function normalizeTopicPage(page) {
            if (!page) return '';
            let normalized = page;
            try {
                normalized = decodeURIComponent(normalized);
            } catch (error) {
                // Keep original value when it is not URI encoded.
            }

            if (normalized.includes('?')) {
                const query = normalized.split('?')[1].split('#')[0];
                const topic = new URLSearchParams(query).get('topic');
                if (topic) return topic;
            }

            if (!normalized.includes('/') && !normalized.includes('.html')) return normalized;
            if (normalized.startsWith('topics/') && !['dashboard', 'glossar', 'template', 'start'].some(x => normalized.includes(x))) {
                return normalized.replace('topics/', '').replace('.html', '').replace(/[\s,]+/g, '_');
            }
            return normalized;
        }

        function findSubjectForPage(page) {
            const topicId = normalizeTopicPage(page);
            for (const [subject, data] of Object.entries(curriculum)) {
                if (data.topics.some(item => item.id === topicId)) return subject;
            }
            return null;
        }

        function setSelectedSubject(subject, shouldSave = true) {
            if (!isKnownSubject(subject)) return;
            const select = document.getElementById('subject-select');
            if (!select) return;
            select.value = subject;
            if (shouldSave) localStorage.setItem(selectedSubjectKey, subject);
        }

        function restoreSelectedSubject(page) {
            const hashSubject = findSubjectForPage(window.location.hash.substring(1));
            const savedSubject = localStorage.getItem(selectedSubjectKey);
            const pageSubject = findSubjectForPage(page);
            const subject = hashSubject || (isKnownSubject(savedSubject) ? savedSubject : null) || pageSubject || 'physik';
            setSelectedSubject(subject);
        }

        function handleSubjectChange() {
            const subject = document.getElementById('subject-select').value;
            setSelectedSubject(subject);
            const search = document.getElementById('topic-search');
            if (search) search.value = '';
            renderNav();
        }

        function setSortMode(mode) {
            currentSortMode = mode;
            document.getElementById('sort-grade-btn').classList.toggle('active', mode === 'grade');
            document.getElementById('sort-topic-btn').classList.toggle('active', mode === 'topic');
            renderNav();
        }

        function renderNav() {
            const subject = document.getElementById('subject-select').value;
            const container = document.getElementById('dynamic-nav-container');
            const query = (document.getElementById('topic-search')?.value || '').trim().toLowerCase();
            container.innerHTML = '';
            
            const items = curriculum[subject].topics.filter(item => {
                if (!query) return true;
                return [item.title, item.grade, item.category].some(value => String(value).toLowerCase().includes(query));
            });
            
            if (items.length === 0) {
                container.innerHTML = '<div class="nav-empty">Keine passenden Themen gefunden.</div>';
                return;
            }

            const groups = {};
            items.forEach(item => {
                const key = currentSortMode === 'grade' ? item.grade : item.category;
                if (!groups[key]) groups[key] = [];
                groups[key].push(item);
            });

            for (const [groupName, groupItems] of Object.entries(groups)) {
                const header = document.createElement('div');
                header.className = 'grade-section';
                header.innerText = currentSortMode === 'grade' ? '📚 ' + groupName : '📂 ' + groupName;
                container.appendChild(header);

                groupItems.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = 'nav-btn';
                    btn.setAttribute('data-page', item.id);
                    btn.onclick = function() { loadPage(item.id, this); };
                    btn.innerText = item.title;
                    container.appendChild(btn);
                });
            }

            const currentPage = localStorage.getItem('physik_current_page');
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.getAttribute('data-page') === currentPage) {
                    btn.classList.add('active');
                }
            });
        }

        function loadPage(page, button, fromHash = false) {
            localStorage.setItem('physik_current_page', page);
            const pageSubject = findSubjectForPage(page);
            const subjectSelect = document.getElementById('subject-select');
            if (pageSubject && subjectSelect && subjectSelect.value !== pageSubject) {
                setSelectedSubject(pageSubject);
                renderNav();
            }
            let url = page;

            // Update URL hash for bookmarking (unless triggered by hashchange already)
            if (!fromHash) {
                window.location.hash = page;
            }

            // Mapping for simple topic IDs to template URL
            if (!page.includes('/') && !page.includes('.html')) {
                url = `topics/template.html?topic=${encodeURIComponent(page)}`;
            } else if (page.startsWith('topics/') && !['dashboard', 'glossar', 'template', 'start'].some(x => page.includes(x))) {
                const topicId = page.replace('topics/', '').replace('.html', '').replace(/[\s,]+/g, '_');
                url = `topics/template.html?topic=${encodeURIComponent(topicId)}`;
            }

            const frame = document.getElementById('game-frame');
            if (frame.src !== window.location.origin + '/' + url && !frame.src.endsWith(url)) {
                frame.src = url;
            }

            // Highlight active button
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if (button) {
                button.classList.add('active');
                frame.title = "Aktuelles Thema: " + button.innerText.trim();
            } else {
                // Find button by page name if navigated via code or hash
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    const pageAttr = btn.getAttribute('data-page');
                    if (pageAttr === page) {
                        btn.classList.add('active');
                        frame.title = "Aktuelles Thema: " + btn.innerText.trim();
                    }
                });
            }
        }

        function toggleDarkMode() {
            let isDark = localStorage.getItem('physik_dark_mode') === 'true';
            isDark = !isDark;
            localStorage.setItem('physik_dark_mode', isDark);
            applyTheme(isDark);
        }

        function applyTheme(isDark) {
            const btn = document.getElementById('dark-mode-toggle');
            if (isDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
                btn.innerHTML = "Tagmodus ☀️";
            } else {
                document.documentElement.removeAttribute('data-theme');
                btn.innerHTML = "Nachtmodus 🌙";
            }
            
            // Notify iframe about theme change
            const frame = document.getElementById('game-frame');
            if (frame.contentWindow) {
                frame.contentWindow.postMessage({ type: 'themeChange', isDark: isDark }, '*');
            }
        }

        function resetProgress() {
            if (confirm("Möchtest du wirklich deinen gesamten Fortschritt, alle Punkte und gelösten Aufgaben löschen?")) {
                localStorage.clear();
                location.reload();
            }
        }

        // Handle browser back/forward buttons
        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.substring(1);
            if (hash) {
                loadPage(hash, null, true);
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            // Restore Score
            document.getElementById('global-score-val').innerText = localStorage.getItem('physik_score') || 0;
            
            // Restore Language
            const lang = localStorage.getItem('physik_lang') || 'de';
            setLanguage(lang);
            
            // Restore Theme
            const isDark = localStorage.getItem('physik_dark_mode') === 'true';
            applyTheme(isDark);
            
            // Restore Page (Prefer Hash -> LocalStorage -> Default)
            const hashPage = window.location.hash.substring(1);
            const savedPage = hashPage || localStorage.getItem('physik_current_page') || 'topics/start.html';
            restoreSelectedSubject(savedPage);
            renderNav();
            loadPage(savedPage, null);
        });
    </script>
