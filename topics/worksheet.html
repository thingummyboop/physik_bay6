<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arbeitsblatt</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; max-width: 800px; margin: 0 auto; color: black; background: white; line-height: 1.6; }
        h1 { text-align: center; border-bottom: 3px solid black; padding-bottom: 10px; margin-bottom: 40px; font-size: 2em; }
        h2 { margin-top: 40px; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
        .question-block { margin-top: 30px; margin-bottom: 30px; page-break-inside: avoid; }
        .question-text { font-weight: bold; font-size: 1.1em; margin-bottom: 15px; }
        .answer-lines { margin-top: 15px; border-bottom: 1px dotted #888; height: 30px; width: 100%; }
        .header-info { display: flex; justify-content: space-between; margin-bottom: 40px; font-size: 1.2em; }
        .print-btn { padding: 15px 30px; font-size: 1.2em; cursor: pointer; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: block; margin: 0 auto; }
        .print-btn:hover { background: #059669; }
        #ws-art-material { overflow-wrap: anywhere; } #ws-art-material svg { max-width: 100%; height: auto; } #ws-art-material figure { break-inside: avoid; margin: 1rem 0; } #ws-art-material table { border-collapse: collapse; width: 100%; } #ws-art-material th, #ws-art-material td { border: 1px solid #888; padding: .4rem; text-align: left; }
        .worksheet-reflection { break-inside: avoid; margin-block: 1.2rem; }
        .ws-chapter-material { overflow-wrap: anywhere; }
        .ws-chapter-material table { border-collapse: collapse; width: 100%; font-size: .9rem; }
        .ws-chapter-material th, .ws-chapter-material td { border: 1px solid #888; padding: .35rem; text-align: left; }
        .ws-chapter-material h3, .ws-chapter-material h4 { break-after: avoid; }
        .ws-chapter-material tr { break-inside: avoid; }
        .exercise-item { margin-bottom: 15px; font-size: 1.2em; }
        [hidden] { display: none !important; } .worksheet-options { list-style: none; padding-left: 0; } #ws-solutions { break-before: page; } button:disabled { opacity: .6; cursor: wait; } @media (max-width: 600px) { body { padding: 16px; } .header-info { display: block; } } @media print {
            body { padding: 0; }
            .no-print { display: none !important; }
        }
    </style>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="../js/curriculum.js"></script><script src="../js/worksheet_generator.js?v=1.3"></script>
</head>
<body>
    <div class="no-print" style="text-align: center; margin-bottom: 40px; padding: 20px; background: #f8fafc; border-radius: 12px; border: 2px dashed #cbd5e1;">
        <p id="ws-description">Das Arbeitsblatt wird vorbereitet.</p><p><a id="ws-chapter-link" href="../index.html">Zur Kapitelübersicht</a></p><label id="ws-solution-control" hidden><input id="ws-include-solutions" type="checkbox"> Lösungen anzeigen und mitdrucken</label>
        <p id="ws-material-control" hidden><label><input id="ws-include-material" type="checkbox" checked> <span id="ws-material-label">Lerntexte, Bildvorlagen und Gestaltungsauftrag mitdrucken</span></label></p>
        <button id="ws-print" disabled class="print-btn" onclick="window.print()">🖨️ Jetzt drucken (als PDF oder auf Papier)</button>
    </div>

    <div class="header-info">
        <div><strong>Fach:</strong> <span id="ws-subject">Lernkapitel</span></div>
        <div><strong>Name:</strong> ________________________</div>
    </div>

    <h1 id="ws-title">Arbeitsblatt</h1>
    
    <div id="ws-content">Lade Fragen...</div>

    <script src="../js/worksheet.js"></script>
</body>
</html>
